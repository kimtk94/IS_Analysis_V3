name: IS AUTO_NEXT remote preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/is-auto-next-preflight-trigger.txt'
      - '.github/workflows/is-auto-next-remote-preflight.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: is-auto-next-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: is-research-readonly
    timeout-minutes: 10
    steps:
      - name: Prepare SSH identity
        id: ssh_identity
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SSH_KEY"
            missing=1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing GitHub Actions secret SSH_KNOWN_HOSTS"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/server_key" >/dev/null
      - name: Remote read-only audit
        id: remote_audit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -o pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::SSH_HOST or SSH_USER is not configured"
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o ForwardAgent=no -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' | tee preflight.log
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HOST=$(hostname)"
          echo "GIT_REV=$(git -C /srv/is-analysis/IS_Analysis_V3 rev-parse --short HEAD 2>&1)"
          echo "CURRENT_BRANCH=$(git -C /srv/is-analysis/IS_Analysis_V3 branch --show-current 2>&1)"
          echo "WORKER_PRESENT=$(test -f /srv/is-analysis/IS_Analysis_V3/scripts/is/github_issue_queue_worker.py && echo yes || echo no)"
          echo "AUTO_NEXT_PRESENT=$(test -f /srv/is-analysis/IS_Analysis_V3/scripts/is/auto_next.py && echo yes || echo no)"
          echo "INSTALLED_WORKER_PRESENT=$(test -f "$HOME/is-harness/github_issue_queue_worker.py" && echo yes || echo no)"
          echo "INSTALLED_RESEARCH_JOBS_PRESENT=$(test -f "$HOME/is-harness/harness_research_jobs.py" && echo yes || echo no)"
          echo "INSTALLED_AUTO_NEXT_PRESENT=$(test -f "$HOME/is-harness/auto_next.py" && echo yes || echo no)"
          echo "USER_QUEUE_SERVICE=$(systemctl --user is-active is-harness-queue.service 2>/dev/null || true)"
          echo "USER_QUEUE_TIMER=$(systemctl --user is-enabled is-harness-queue.timer 2>/dev/null || true)"
          echo "USER_TIMERS:"
          systemctl --user list-timers --all --no-pager 2>&1 | grep -Ei 'harness|queue|auto.next|is-' || true
          echo "SYSTEM_TIMERS:"
          systemctl list-timers --all --no-pager 2>&1 | grep -Ei 'harness|queue|auto.next|is-' || true
          echo "RELATED_PROCESSES:"
          pgrep -af '[g]ithub_issue_queue_worker|[a]uto_next.py|[h]arness_research_jobs' || true
          echo "RELATED_USER_UNITS:"
          systemctl --user list-units --type=service --all --no-pager 2>&1 | grep -Ei 'harness|queue|auto.next|is-' || true
          echo "LOCK_DIR:"
          stat -c '%a %U:%G %n' /srv/is-analysis/results/is/github_actions_runs 2>&1 || true
          REMOTE
          if ! grep -q "INSTALLED_WORKER_PRESENT=yes" preflight.log && ! grep -q "WORKER_PRESENT=yes" preflight.log; then
            echo "::error::Worker missing from both deployed home and checkout"
            exit 1
          fi
          if ! grep -q "INSTALLED_AUTO_NEXT_PRESENT=yes" preflight.log && ! grep -q "AUTO_NEXT_PRESENT=yes" preflight.log; then
            echo "::warning::AUTO_NEXT is not yet deployed; activation gate remains closed"
          fi
      - name: Publish inspection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-auto-next-preflight
          path: preflight.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Record sanitized result as GitHub Issue
        if: always()
        uses: actions/github-script@v7
        env:
          IDENTITY_OUTCOME: ${{ steps.ssh_identity.outcome }}
          AUDIT_OUTCOME: ${{ steps.remote_audit.outcome }}
        with:
          script: |
            const identity = process.env.IDENTITY_OUTCOME;
            const audit = process.env.AUDIT_OUTCOME;
            const passed = identity === 'success' && audit === 'success';
            const title = '[IS AUTO_NEXT preflight] ' + (passed ? 'PASS' : 'FAIL') + ' run ' + context.runId;
            const body = [
              'Read-only SSH preflight result (no credentials or raw server logs).',
              '',
              '- Workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- Revision: ' + context.sha,
              '- Identity step: ' + identity,
              '- Remote audit step: ' + audit,
              '- Preflight result: ' + (passed ? 'PASS' : 'FAIL'),
              '- Deployment authorization: NONE',
              '- Timer activation: NOT PERFORMED',
              '',
              'Inspect the Actions artifact privately before any deployment.'
            ].join('\n');
            await github.rest.issues.create({
              ...context.repo,
              title,
              body
            });
