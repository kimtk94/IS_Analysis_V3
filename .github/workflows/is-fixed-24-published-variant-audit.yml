name: IS fixed 24 published variant audit
on:
  push:
    branches: [research/is-fixed-24-subtype-extension-20261125]
    paths: ['scripts/is/fixed_24_published_variant_audit.py','.github/workflows/is-fixed-24-published-variant-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publisher-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: is24-anchor
          path: inputs/anchor
          run-id: 45534891070
          github-token: ${{ github.token }}
      - name: Retrieve pinned published supplement and audit full panel
        run: |
          python -m pip install 'openpyxl==3.1.5'
          curl -fLsS --connect-timeout 15 --max-time 75 --max-filesize 2000000 'https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-022-05165-3/MediaObjects/41586_2022_5165_MOESM4_ESM.xlsx' -o "$RUNNER_TEMP/supp.xlsx"
          python -m py_compile scripts/is/fixed_24_published_variant_audit.py
          python scripts/is/fixed_24_published_variant_audit.py --manifest inputs/anchor/manifest.json --workbook "$RUNNER_TEMP/supp.xlsx" --out outputs/fixed24-publication-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: is24-published-variant-audit
          path: outputs/
          if-no-files-found: error
          retention-days: 90
