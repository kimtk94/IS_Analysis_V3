name: IS integrate fixed subtype recovery
on:
  push:
    branches: [research/is-fixed-subtype-indexed-20261125]
    paths: ['.github/workflows/is-integrate-fixed-subtype-recovery.yml','scripts/is/integrate_fixed_subtype_recovery.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve previously produced public summary artifacts
        uses: actions/download-artifact@v4
        with:
          name: fixed-is-indexed-contrasts
          path: inputs/original
          run-id: 45533313848
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: col4a2-published-pair-*
          path: inputs/recovery
          run-id: 45533611144
          github-token: ${{ github.token }}
      - name: Integrate only locked published allele-pair recoveries
        run: |
          python -m pip install 'PyYAML==6.0.2'
          mkdir -p studies
          for study in EUR_AIS EUR_CES EUR_LAS EUR_SVS EAS_AIS EAS_CES EAS_LAS EAS_SVS; do
            mv "inputs/recovery/col4a2-published-pair-$study" "studies/$study"
          done
          python scripts/is/integrate_fixed_subtype_recovery.py --original inputs/original/contrasts.json --recovery studies --out outputs/integrated-contrasts.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-fixed-subtype-integrated-contrasts
          path: outputs/
          if-no-files-found: error
          retention-days: 90
