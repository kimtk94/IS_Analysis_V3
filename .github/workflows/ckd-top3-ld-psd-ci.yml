name: CKD Top3 LD PSD read-only audit
on:
  push:
    branches: [research/thesis-evidence-freeze-20261015]
    paths:
      - 'scripts/audit_ckd_top3_ld_psd_readonly.py'
      - '.github/workflows/ckd-top3-ld-psd-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  psd:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do test -n "${!name}" || exit 1; done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ckd_psd_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ckd_psd_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ckd_psd_key >/dev/null
      - name: Copy unchanged LD sources to ephemeral runner and audit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          mkdir -p "$RUNNER_TEMP/ckd_ld_psd"
          for g in SDCCAG8 INHBC UMOD; do
            for ext in ld.meta.tsv ld.bin; do
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
                -i ~/.ssh/ckd_psd_key "$SSH_USER@$SSH_HOST" \
                "cat /srv/is-analysis/data/ckd/stage2c_ld/ld/$g.$ext" \
                > "$RUNNER_TEMP/ckd_ld_psd/$g.$ext"
            done
          done
          python3 scripts/audit_ckd_top3_ld_psd_readonly.py --lddir "$RUNNER_TEMP/ckd_ld_psd"
      - name: Purge temporary inputs
        if: always()
        run: rm -rf "$HOME/.ssh/ckd_psd_key" "$RUNNER_TEMP/ckd_ld_psd"
