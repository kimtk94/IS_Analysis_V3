name: HCC Stage28B Sample-Aligned Numeric Transform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage28b-numeric-transform.yml'
      - 'scripts/hcc/audit_ng_stage28b_numeric_transform.R'
      - 'scripts/hcc/verify_stage28b_numeric_transform.py'
      - 'tests/test_hcc_stage28b_numeric_transform.py'

permissions:
  contents: read

jobs:
  numeric-row-z-source-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - name: Synthetic fail-closed source numeric QA and patient ID claim guards
        run: python -m unittest discover -s tests -p 'test_hcc_stage28b_numeric_transform.py' -v
      - name: Verify heldout gene-level actual numeric row-z source equality after sample matching
        run: |
          Rscript scripts/hcc/audit_ng_stage28b_numeric_transform.R \
            results/hcc/feasibility/stage28b_sample_aligned_z_transform.json
      - name: Source hash / numeric bounds / no label correction postflight
        run: |
          python scripts/hcc/verify_stage28b_numeric_transform.py \
            --input results/hcc/feasibility/stage28b_sample_aligned_z_transform.json \
            --out results/hcc/feasibility/stage28b_sample_aligned_z_transform_review.json
      - name: Upload aggregate heldout residual statistics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage28b-heldout-sample-aligned-source-zscore-reconstruction
          path: |
            results/hcc/feasibility/stage28b_sample_aligned_z_transform.json
            results/hcc/feasibility/stage28b_sample_aligned_z_transform_review.json
          retention-days: 30
          if-no-files-found: error
