name: IS stroke GSE331114 pilot 10x matrix QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_stroke_gse331114_mex_pilot.py'
      - 'tests/is/test_stroke_gse331114_mex_pilot.py'
      - '.github/workflows/is_stroke_mex_pilot.yml'

permissions:
  contents: read

jobs:
  stroke-mex-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sample-level 10x MEX parser
        run: python3 -m unittest discover -s tests/is -p 'test_stroke_gse331114_mex_pilot.py' -v
      - name: Verify one real AIS and one real non-stroke MEX matrix and metadata
        run: python3 scripts/is/audit_stroke_gse331114_mex_pilot.py --out-dir artifacts/is_stroke_mex_pilot
      - name: Publish non-identifying matrix structure evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-stroke-gse331114-mex-pilot
          path: artifacts/is_stroke_mex_pilot/
          retention-days: 30
          if-no-files-found: warn
