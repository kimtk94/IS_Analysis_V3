name: HCC P0 Parallel Evidence Batch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-p0-parallel-batch.yml'
      - 'scripts/hcc/**'
      - 'tests/test_hcc_*.py'
      - 'research/hcc/feasibility/**'

  push:
    branches: [main]
    paths:
      - '.github/workflows/hcc-p0-parallel-batch.yml'
      - 'scripts/hcc/**'
      - 'tests/test_hcc_*.py'
      - 'research/hcc/feasibility/**'

permissions:
  contents: read

concurrency:
  group: hcc-p0-evidence-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  independent-probes:
    name: P0 ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        track:
          - ng-public
          - pdc-mapping
          - rna-access
          - geo-clinical
          - xing-clinical
          - regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute every task in this independent track
        run: |
          python scripts/hcc/run_parallel_p0_track.py \
            --track "${{ matrix.track }}" \
            --out-dir "results/hcc/parallel/${{ matrix.track }}"
      - name: Preserve both successful and failed lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-p0-${{ matrix.track }}
          path: results/hcc/parallel/${{ matrix.track }}/
          retention-days: 14
          if-no-files-found: error

  evidence-summary:
    name: Collect all six lanes and validate scientific guardrails
    needs: independent-probes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test aggregator missing-artifact and partial-failure behavior
        run: python -m unittest discover -s tests -p 'test_hcc_parallel_p0_batch.py' -v
      - name: Download all completed lane artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hcc-p0-*
          path: results/hcc/parallel/artifacts
          merge-multiple: false
      - name: Create fail-closed aggregate status and Markdown evidence
        if: always()
        run: |
          python scripts/hcc/aggregate_parallel_p0.py \
            --artifact-root results/hcc/parallel/artifacts \
            --out-dir results/hcc/parallel/batch
      - name: Publish combined audit as GitHub job summary
        if: always()
        run: |
          if test -f results/hcc/parallel/batch/batch_report.md; then
            cat results/hcc/parallel/batch/batch_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain consolidated non-identifying evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-p0-batch-summary
          path: results/hcc/parallel/batch/
          retention-days: 30
          if-no-files-found: error
