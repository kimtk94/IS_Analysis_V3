name: Muscle publication baseline phenotype and source qualification
on:
  push:
    branches: [research/publication-sprint-20261124]
    paths: ['scripts/muscle_publication_baseline_gate.py','.github/workflows/muscle-publication-baseline-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [GSE277819, GSE42507, ena, supplement]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.mode == 'supplement'
        run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile scripts/muscle_publication_baseline_gate.py
      - run: python scripts/muscle_publication_baseline_gate.py ${{ matrix.mode }} --root "$RUNNER_TEMP/source" --out outputs/source.json
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-baseline-gate-${{ matrix.mode }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90
