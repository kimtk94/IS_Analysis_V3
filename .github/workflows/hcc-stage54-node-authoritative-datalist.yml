name: HCC Stage54 NODE Official Project File IDs + NIAID Indexed Metadata
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hcc/audit_stage54_node_authoritative_datalist.py"
      - "tests/test_hcc_stage54_node_authoritative_datalist.py"
      - ".github/workflows/hcc-stage54-node-authoritative-datalist.yml"
permissions:
  contents: read
jobs:
  offline-source-identity-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate NODE exact-project identity and fail-closed file provenance
        run: python -m unittest discover -s tests -p "test_hcc_stage54_node_authoritative_datalist.py" -v
  source-metadata-probe:
    strategy:
      fail-fast: false
      matrix:
        mode: ["node", "niaid"]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe only explicitly public source project metadata and indexed IDs
        run: |
          python scripts/hcc/audit_stage54_node_authoritative_datalist.py \
            --mode "${{ matrix.mode }}" \
            --out "results/hcc/stage54/${{ matrix.mode }}_source_metadata.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-stage54-${{ matrix.mode }}-public-metadata
          path: results/hcc/stage54/*.json
          if-no-files-found: warn
          retention-days: 30
