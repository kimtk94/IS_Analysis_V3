name: HCC Stage40 Gao Original CDAP Cross-Assay Name Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage40-original-cdap-crossassay.yml'
      - 'scripts/hcc/audit_stage40_cdap_crossassay_source_labels.py'
      - 'tests/test_hcc_stage40_cdap_crossassay_source_labels.py'

permissions:
  contents: read

jobs:
  source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original source cross-assay and no patient inference
        run: python -m unittest discover -s tests -p 'test_hcc_stage40_cdap_crossassay_source_labels.py' -v
      - name: Re-read original CDAP TMT proteome/phospho and compare biological names
        run: |
          python scripts/hcc/audit_stage40_cdap_crossassay_source_labels.py \
            --out results/hcc/stage40/source_name_bridge_aggregate.json \
            --review-out results/hcc/stage40/source_name_bridge_review.json
      - name: Save only aggregate original CDAP source comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage40-source-cdap-proteome-phospho
          path: results/hcc/stage40/*.json
          retention-days: 30
          if-no-files-found: error
