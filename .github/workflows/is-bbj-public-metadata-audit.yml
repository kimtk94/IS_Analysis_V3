name: IS BBJ 2021 Public Phenotype Metadata Gate (CI only)

on:
  push:
    branches: [feat/is-bbj-2021-source-evidence-freeze-20261102]
    paths:
      - "scripts/is/audit_bbj_2021_public_metadata.py"
      - "tests/test_is_bbj_2021_public_metadata.py"
      - ".github/workflows/is-bbj-public-metadata-audit.yml"
  pull_request:
    paths:
      - "scripts/is/audit_bbj_2021_public_metadata.py"
      - "tests/test_is_bbj_2021_public_metadata.py"
      - ".github/workflows/is-bbj-public-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline negative controls
        run: python3 -m unittest discover -s tests -p 'test_is_bbj_2021_public_metadata.py' -v
      - name: Read bounded public pages and publish only aggregate provenance
        run: python3 scripts/is/audit_bbj_2021_public_metadata.py --output ci_reports/is_bbj2021_public_metadata.json
      - name: Upload metadata audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-bbj2021-public-metadata
          path: ci_reports/is_bbj2021_public_metadata.json
          if-no-files-found: ignore
          retention-days: 30
