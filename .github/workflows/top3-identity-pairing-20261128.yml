name: TOP3 source identity and pairing audit
on:
  push:
    branches: [research/top3-publication-protocol-20261128]
    paths: ['.github/workflows/top3-identity-pairing-20261128.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        assay: [pQTL,eQTL]
    env:
      ASSAY: ${{ matrix.assay }}
    steps:
      - name: Inspect exact assay identifiers and fixed GCC2 coordinate window
        run: |
          python3 - <<'PY'
          import csv,hashlib,io,json,math,os,re,urllib.parse,urllib.request
          from collections import Counter
          from pathlib import Path
          assay=os.environ['ASSAY']
          size,md5,sha,rows_expected={'pQTL':(8085897,'5ed66ce34705c8aeff36b68162c73b64','03084fb65d91708fbc3588076a4a25b94b19adff36079e87aa72344f11ee8b6a',108872),'eQTL':(70906052,'caca80b5a56f3fd9ceeb3b03b9b4cc07','165264e5ef824098f70249261836eb40f08c9e0d99cecde3c257902ee60ca28c',870843)}[assay]
          url='https://zenodo.org/records/19638349/files/'+urllib.parse.quote('skin '+assay+' summary statistics.txt')+'?download=1'
          out={'assay':assay,'status':'HOLD','scientific_validation':False,'window_grch38':['2',108372562,109372562],'anchor_position':108872562}
          try:
              with urllib.request.urlopen(url,timeout=60) as res: raw=res.read(size+1)
              if len(raw)!=size or hashlib.md5(raw).hexdigest()!=md5 or hashlib.sha256(raw).hexdigest()!=sha: raise ValueError('source identity mismatch')
              f=io.StringIO(raw.decode('utf-8-sig'))
              header=f.readline().strip().split()
              expected='gene_id variant_id tss_distance ma_samples ma_count maf pval_nominal slope slope_se'.split()
              if header!=expected: raise ValueError('schema mismatch')
              genes=Counter(); kinds=Counter(); formats=Counter(); example=[]; region=Counter(); anchor=Counter(); invalid=0; n=0
              pat=re.compile(r'(?:chr)?([0-9]+|X|Y|MT)[:_](\d+)[:_]([ACGT]+)[:_]([ACGT]+)(?:[_:]b38)?$',re.I)
              for line in f:
                  if not line.strip(): continue
                  a=line.split();n+=1
                  if len(a)!=9: raise ValueError('ragged')
                  g,v=a[:2];genes[g]+=1
                  if len(example)<5: example.append([g,v])
                  if re.fullmatch(r'ENSG\d+(?:\.\d+)?',g): kinds['ensembl']+=1
                  elif re.fullmatch(r'\d+',g): kinds['numeric']+=1
                  else: kinds['other']+=1
                  try:
                      maf,p,b,se=map(float,a[5:9])
                      if not all(math.isfinite(x) for x in (maf,p,b,se)) or not 0<maf<=.5 or not 0<=p<=1 or se<=0: invalid+=1
                  except ValueError: invalid+=1
                  m=pat.fullmatch(v)
                  if m:
                      formats['coordinate_alleles']+=1
                      ch,pos,ref,alt=m.groups()
                      if ch=='2' and 108372562<=int(pos)<=109372562:
                          region[g]+=1
                          if int(pos)==108872562: anchor[g]+=1
                  elif re.fullmatch(r'rs\d+',v): formats['rsid']+=1
                  else: formats['other']+=1
              if n!=rows_expected: raise ValueError('row parity mismatch')
              out.update(status='ID_INVENTORY_ONLY',source_sha256=sha,rows=n,unique_gene_ids=len(genes),gene_id_types=dict(kinds),variant_id_types=dict(formats),examples=example,invalid_numeric_rows=invalid,gcc2_exact_ids={g:n for g,n in genes.items() if re.fullmatch(r'GCC2|ENSG00000135968(?:\.\d+)?',g,re.I)},regional_gene_row_counts=dict(region),anchor_position_gene_row_counts=dict(anchor))
              # Coordinate match is a diagnostic; never infer allele orientation or gene mapping from it.
          except Exception as e: out['error']=type(e).__name__+': '+str(e)[:300]
          Path('result.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skin-identities-${{ matrix.assay }}
          path: result.json
  ocular:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit public sample metadata keys and treatment labels
        run: |
          python3 - <<'PY'
          import hashlib,json,re,time,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('docs/publication/evidence/top3_source_qualification_readback_20261128.json')
          data=json.loads(path.read_text())
          assert data['run_id']==46124457726
          out={'status':'PUBLIC_METADATA_DIAGNOSTIC_ONLY','scientific_validation':False,'records':[]}
          for job in data['jobs']:
              r=job['result']
              if 'project' not in r: continue
              for row in r['runs']:
                  acc=row['sample_accession']
                  assert re.fullmatch(r'SAMN\d+',acc)
                  item={'sample':acc,'run':row['run_accession'],'project':r['project'],'title':row['sample_title']}
                  try:
                      with urllib.request.urlopen('https://www.ebi.ac.uk/ena/browser/api/xml/'+acc,timeout=6) as res: raw=res.read(150001)
                      if len(raw)>150000: raise ValueError('metadata cap')
                      root=ET.fromstring(raw)
                      attrs={}
                      for e in root.findall('.//SAMPLE_ATTRIBUTE'):
                          tag=(e.findtext('TAG') or '').strip().lower()
                          val=(e.findtext('VALUE') or '').strip()
                          if tag: attrs.setdefault(tag,[]).append(val)
                      item.update(sha256=hashlib.sha256(raw).hexdigest(),attribute_keys=sorted(attrs),treatment_attributes={k:v for k,v in attrs.items() if k in ('treatment','treatment group','experimental condition','condition','group','response','responder status','dexamethasone')})
                      # Do not export other donor attributes or assign a donor from accession order.
                  except Exception as e: item['error']=type(e).__name__+': '+str(e)[:160]
                  out['records'].append(item)
                  time.sleep(.25)
          out['retrieved']=sum('sha256' in x for x in out['records'])
          Path('result.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ocular-public-sample-attributes
          path: result.json
