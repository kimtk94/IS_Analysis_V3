name: CKM GIGASTROKE original supplement EAS AIS cohort evidence
on:
  push:
    paths:
      - '.github/workflows/ckm-gigastroke-original-supplement-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse-original-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ckm-stroke-staged-actions-20261111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read GIGASTROKE 2022 source supplemental Excel via OOXML in memory
        run: |
          python -m py_compile scripts/ckm_stroke/read_gigastroke_eas_cohort_supplement.py
          python -m scripts.ckm_stroke.read_gigastroke_eas_cohort_supplement \
            --out artifacts/is/GIGASTROKE_EAS_AIS_original_cohort_supplement_HOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-GIGASTROKE-original-EAS-cohort-supplement-HOLD
          path: artifacts/is/GIGASTROKE_EAS_AIS_original_cohort_supplement_HOLD.json
          retention-days: 30
