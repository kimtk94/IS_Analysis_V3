name: IS fixed 24 manuscript figures
on:
  push:
    branches: [research/is-fixed-24-subtype-extension-20261125]
    paths: ['scripts/is/fixed24_manuscript_figures.py','.github/workflows/is-fixed24-manuscript-figures.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: is24-subtype-contrasts
          path: inputs
          run-id: 45534891070
          github-token: ${{ github.token }}
      - name: Generate all-family matrix and conservative contrast plots
        run: |
          python -m pip install 'matplotlib==3.10.1' 'numpy==2.2.4'
          python scripts/is/fixed24_manuscript_figures.py --contrasts inputs/contrasts.json --evidence docs/publication/evidence/is_fixed24_subtype_contrasts_20261125.json --out outputs/figures
      - uses: actions/upload-artifact@v4
        with:
          name: is-fixed24-manuscript-figures
          path: outputs/figures/
          if-no-files-found: error
          retention-days: 90
