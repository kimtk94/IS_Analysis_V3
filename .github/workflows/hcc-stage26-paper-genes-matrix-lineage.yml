name: HCC Stage26 Original Ng Genes and Suter Matrix Lineage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage26-paper-genes-matrix-lineage.yml'
      - 'scripts/hcc/audit_ng_stage26_full_vs_fullz.R'
      - 'scripts/hcc/probe_ng_stage26_paper_genes.py'
      - 'scripts/hcc/verify_ng_stage26_source_and_lineage.py'
      - 'tests/test_hcc_stage26_original_gene_lineage.py'

permissions:
  contents: read

jobs:
  original-paper-gene-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact original gene-set cannot be inferred from matching counts
        run: python -m unittest discover -s tests -p 'test_hcc_stage26_original_gene_lineage.py' -v
      - name: Audit official public Ng Figure 2 Source Data and Supplementary XLSX gene namespaces
        run: |
          python scripts/hcc/probe_ng_stage26_paper_genes.py \
            --out results/hcc/feasibility/stage26_original_gene_xlsx_source.json
      - name: Validate only provenance counts; exact historical 5481 identity HOLD
        run: |
          python scripts/hcc/verify_ng_stage26_source_and_lineage.py \
            --kind paper \
            --input results/hcc/feasibility/stage26_original_gene_xlsx_source.json \
            --out results/hcc/feasibility/stage26_original_gene_xlsx_review.json
      - name: Upload provenance-only source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage26-original-genes-public-supplement-audit
          path: |
            results/hcc/feasibility/stage26_original_gene_xlsx_source.json
            results/hcc/feasibility/stage26_original_gene_xlsx_review.json
          if-no-files-found: warn
          retention-days: 30

  full-fullz-quantitative-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-SHA256-pinned HCCfull vs HCCfullz matrix transformation diagnostics
        run: |
          Rscript scripts/hcc/audit_ng_stage26_full_vs_fullz.R \
            results/hcc/feasibility/stage26_full_fullz_lineage.json
      - name: Validate layer-level numeric evidence while retaining V03 PARTIAL
        run: |
          python scripts/hcc/verify_ng_stage26_source_and_lineage.py \
            --kind lineage \
            --input results/hcc/feasibility/stage26_full_fullz_lineage.json \
            --out results/hcc/feasibility/stage26_full_fullz_review.json
      - name: Upload aggregate numeric relation metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage26-source-pinned-full-fullz-lineage
          path: |
            results/hcc/feasibility/stage26_full_fullz_lineage.json
            results/hcc/feasibility/stage26_full_fullz_review.json
          if-no-files-found: warn
          retention-days: 30
