name: IS GWAS source FTP discovery (bounded)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/is/audit_gwas_sumstats_ftp_prefix.py"
      - "tests/is/test_gwas_sumstats_ftp_prefix.py"
      - ".github/workflows/is_gwas_source_discovery.yml"

permissions:
  contents: read

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test bounded source audit without network
        run: python3 -m unittest discover -s tests/is -p 'test_gwas_sumstats_ftp_prefix.py' -v
      - name: Detect official source file and bounded header prefix (not full file)
        run: python3 scripts/is/audit_gwas_sumstats_ftp_prefix.py --out-dir artifacts/is_eas_gwas_source_discovery
      - name: Attach source audit report even if remote access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-gigastroke-gwas-ftp-discovery
          path: artifacts/is_eas_gwas_source_discovery/
          if-no-files-found: warn
          retention-days: 30
