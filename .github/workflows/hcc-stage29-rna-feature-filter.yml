name: HCC Stage29 Source RNA Feature Exclusion Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage29-rna-feature-filter.yml'
      - 'scripts/hcc/audit_ng_stage29_rna_feature_filter.R'
      - 'scripts/hcc/verify_ng_stage29_rna_filter.py'
      - 'tests/test_hcc_stage29_rna_filter.py'

permissions:
  contents: read

jobs:
  fullz-588-rna-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - name: Test feature exclusion scientific and source identity guards
        run: python -m unittest discover -s tests -p 'test_hcc_stage29_rna_filter.py' -v
      - name: Assess exactly 588 lost RNA features using source-pinned RDS
        run: |
          Rscript scripts/hcc/audit_ng_stage29_rna_feature_filter.R \
            results/hcc/feasibility/stage29_rna_feature_filter.json
      - name: Validate verified source SD counts and no unsupported source-generation claim
        run: |
          python scripts/hcc/verify_ng_stage29_rna_filter.py \
            --input results/hcc/feasibility/stage29_rna_feature_filter.json \
            --out results/hcc/feasibility/stage29_rna_feature_filter_postflight.json
      - name: Retain aggregate gene variance distribution only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage29-source-pinned-rna-588-filter
          path: |
            results/hcc/feasibility/stage29_rna_feature_filter.json
            results/hcc/feasibility/stage29_rna_feature_filter_postflight.json
          if-no-files-found: error
          retention-days: 30
