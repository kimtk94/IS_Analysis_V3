name: MASTER DEGREE eight-track source consistency 2026-11-04
on:
  pull_request:
    paths:
      - '.github/workflows/research-eight-track-20261104.yml'
      - 'scripts/research/daily_20261104_source_consistency.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily:
    name: 'Source consistency — ${{ matrix.track }}'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        track: [is, glaucoma, hcc, radiomics, ocular, muscle, oral, skin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Perform bounded independent source check
        run: python scripts/research/daily_20261104_source_consistency.py --track "${{ matrix.track }}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-20261104-${{ matrix.track }}
          path: results/research_operations/20261104/${{ matrix.track }}.json
          if-no-files-found: error
          retention-days: 30
