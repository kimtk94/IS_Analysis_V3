name: HCC Stage30 Bounded Direct PDC Quant API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage30-gao-direct-quant-api.yml'
      - 'scripts/hcc/probe_stage30_gao_direct_quant_endpoint.py'
      - 'tests/test_hcc_stage30_direct_quant_endpoint.py'

permissions:
  contents: read

jobs:
  direct-PDC-quant-API-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source privacy and bounded quantitative-response classification
        run: python -m unittest discover -s tests -p 'test_hcc_stage30_direct_quant_endpoint.py' -v
      - name: Direct PDC protein gene-by-aliquot API access within strict 2MiB budget
        run: |
          python scripts/hcc/probe_stage30_gao_direct_quant_endpoint.py \
            --out results/hcc/stage30/PDC_direct_quant_api_bounded.json \
            --review-out results/hcc/stage30/PDC_direct_quant_api_bounded_review.json
      - name: Upload source status only, never raw samples, full matrix or aliq IDs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage30-PDC-direct-quant-api-bounded
          path: |
            results/hcc/stage30/PDC_direct_quant_api_bounded.json
            results/hcc/stage30/PDC_direct_quant_api_bounded_review.json
          if-no-files-found: error
          retention-days: 30
