name: Ocular Thesis Figures from Frozen Verified Aggregates
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deterministic-multi-figure-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only plotting dependency and compile code
        run: |
          python -m pip install 'matplotlib==3.9.4'
          python -m py_compile scripts/ocular/ocular_thesis_figures_from_verified_artifacts.py
      - name: Retrieve three immutable and successful source analyses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ocular-thesis/third" "$RUNNER_TEMP/ocular-thesis/cutoff" "$RUNNER_TEMP/ocular-thesis/dual" ocular-thesis-figures-public
          gh run download 41186736618 -n ocular-third-gse301517-preflight -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/ocular-thesis/third"
          gh run download 41199532259 -n ocular-gate-b-050-full-ql-refit -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/ocular-thesis/cutoff"
          gh run download 41207583296 -n ocular-gate-b-dual55-validated-review -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/ocular-thesis/dual"
      - name: Independently verify pinned file SHA256 and render three figures
        run: |
          python -u scripts/ocular/ocular_thesis_figures_from_verified_artifacts.py \
            --third "$RUNNER_TEMP/ocular-thesis/third" \
            --cutoff "$RUNNER_TEMP/ocular-thesis/cutoff" \
            --dual "$RUNNER_TEMP/ocular-thesis/dual" \
            --out ocular-thesis-figures-public
      - name: Erase transient source copies after figure build
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ocular-thesis"
      - name: Upload PNG SVG figure legends evidence and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocular-thesis-frozen-figures
          path: ocular-thesis-figures-public/
          retention-days: 90
          if-no-files-found: warn
