name: CKD EAS screen candidate evidence audit
on:
  push:
    branches: [research/ckd-eas-proteome-screen-20261124]
    paths: ['scripts/ckd_eas_screen_candidate_audit.py','.github/workflows/ckd-eas-candidate-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Retrieve exact derived screen archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in egfr:14922713044 bun:14923201035; do
            trait=${pair%:*}
            id=${pair#*:}
            curl -fLsS --retry 1 --connect-timeout 15 --max-time 45 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$trait.zip"
          done
      - name: Download publisher mapping and pQTL supplementary evidence
        run: |
          set -eu
          curl -fLsS --retry 1 --connect-timeout 15 --max-time 80 --max-filesize 20000000 "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-025-56935-2/MediaObjects/41467_2025_56935_MOESM4_ESM.xlsx" -o "$RUNNER_TEMP/mapping.xlsx"
          curl -fLsS --retry 1 --connect-timeout 15 --max-time 80 --max-filesize 50000000 "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-025-56935-2/MediaObjects/41467_2025_56935_MOESM6_ESM.xlsx" -o "$RUNNER_TEMP/published.xlsx"
      - run: python3 scripts/ckd_eas_screen_candidate_audit.py --root "$RUNNER_TEMP" --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: ckd-eas-candidate-audit
          path: outputs/
          if-no-files-found: error
          retention-days: 90
