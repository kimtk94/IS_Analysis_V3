name: IS chr10 published fine-mapping and immune QTL intersection
on:
  push:
    branches: [research/is-cross-ancestry-effect-20261124]
    paths: ['scripts/is/chr10_published_cs_intersection.py','.github/workflows/is-chr10-published-cs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-intersection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Download only pinned candidate aggregate and prior verified public supplement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fLsS --connect-timeout 15 --max-time 45 --max-filesize 1000000 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14925039883/zip" -o "$RUNNER_TEMP/qtl.zip"
          curl -fLsS --connect-timeout 15 --max-time 45 --max-filesize 2000000 "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-022-05165-3/MediaObjects/41586_2022_5165_MOESM4_ESM.xlsx" -o "$RUNNER_TEMP/supp.xlsx"
      - run: python scripts/is/chr10_published_cs_intersection.py --root "$RUNNER_TEMP" --out outputs/intersection.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-chr10-published-cs-conditional-intersection
          path: outputs/
          if-no-files-found: error
          retention-days: 90
