name: IS COL4A2 brain vascular cis pair audit
on:
  push:
    branches: [research/is-fixed-subtype-indexed-20261125]
    paths: ['scripts/is/col4a2_brain_vascular_qtl.py','.github/workflows/is-col4a2-brain-vascular-qtl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-qtl-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public publisher files and fixed candidate rows
        run: |
          python -m py_compile scripts/is/col4a2_brain_vascular_qtl.py
          python scripts/is/col4a2_brain_vascular_qtl.py --root "$RUNNER_TEMP/brain-qtl" --out outputs/col4a2-vascular.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-col4a2-brain-vascular-fixed-pairs
          path: outputs/col4a2-vascular.json
          if-no-files-found: error
          retention-days: 90
