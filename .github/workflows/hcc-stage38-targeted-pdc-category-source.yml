name: HCC Stage38 Target Official Author Source Categories

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage38-targeted-pdc-category-source.yml'
      - 'scripts/hcc/audit_stage38_targeted_source_categories.py'
      - 'tests/test_hcc_stage38_targeted_source_categories.py'

permissions:
  contents: read

jobs:
  targeted-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test official category filter and no patient inference
        run: python -m unittest discover -s tests -p 'test_hcc_stage38_targeted_source_categories.py' -v
      - name: Verify PDC study declared file counts and targeted author source categories
        run: |
          python scripts/hcc/audit_stage38_targeted_source_categories.py \
            --out results/hcc/stage38/targeted_source_categories.json \
            --review-out results/hcc/stage38/targeted_source_review.json
      - name: Upload anonymous source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage38-targeted-pdc-source-category
          path: results/hcc/stage38/*.json
          retention-days: 30
          if-no-files-found: error
