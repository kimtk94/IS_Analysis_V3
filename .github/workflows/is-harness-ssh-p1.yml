name: IS Harness SSH P1 (manual, non-LIVE)
on:
  push:
    branches: [main]
    paths:
      - '.github/research-queue/is-p1-request.json'
  workflow_dispatch:
    inputs:
      mode:
        description: P1 source probe or versioned audit
        type: choice
        required: true
        default: probe
        options: [probe, run]
permissions:
  contents: read
concurrency:
  group: is-harness-ssh-p1
  cancel-in-progress: false
jobs:
  ssh-p1:
    runs-on: ubuntu-latest
    environment: is-research-readonly
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: research/is-broad-discovery-20261009
          path: p1-research
      - name: Validate Git-triggered research request
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path(".github/research-queue/is-p1-request.json").read_text())
          expected={"schema_version":1,"job":"is-p1-full-universe","mode":"run",
                    "source_version":"646replayed_20261011_v2",
                    "non_live_only":True,"authorized":True}
          if obj != expected:
              raise SystemExit("RESEARCH_QUEUE_REQUEST_INVALID: exact allowlist required")
          print("P1_GIT_REQUEST_VALIDATED=PASS")
          PY
      - name: Configure SSH
        shell: bash
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/server_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -yf "$HOME/.ssh/server_key" >/dev/null || exit 1
      - name: Stage scripts
        shell: bash
        run: |
          OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i $HOME/.ssh/server_key"
          TMP=$(ssh $OPTS "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/is-harness-p1.XXXXXXXX') || exit 1
          [[ "$TMP" == /tmp/is-harness-p1.* ]] || exit 1
          echo "REMOTE_TMP=$TMP" >> "$GITHUB_ENV"
          scp $OPTS scripts/is/harness_p1_full_universe.py p1-research/scripts/is/audit_existing_2225_evidence_priority_queue.py "$SSH_USER@$SSH_HOST:$TMP/" || exit 1
          echo "SOURCE_COMMIT=$(git -C p1-research rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run P1 gate
        shell: bash
        env:
          MODE: ${{ github.event_name == 'push' && 'run' || inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "python3 '$REMOTE_TMP/harness_p1_full_universe.py' --mode '$MODE' --run-id '$RUN_ID' --attempt '$ATTEMPT' --source-commit '$SOURCE_COMMIT' --audit-script '$REMOTE_TMP/audit_existing_2225_evidence_priority_queue.py'"
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [[ "$REMOTE_TMP" == /tmp/is-harness-p1.* ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_TMP/harness_p1_full_universe.py' '$REMOTE_TMP/audit_existing_2225_evidence_priority_queue.py'; rmdir '$REMOTE_TMP'" || true
          fi
