name: IS P3A original GTEx 21-gene sdY AN heterogeneous sensitivity

on:
  push:
    paths:
      - '.github/workflows/is-p3a-gtex-21gene-real-sdy.yml'
      - 'scripts/is/qtl_original_indexed_http_range.py'
      - 'scripts/is/audit_p3a_gtex_21gene_real_sdY_AN_sensitivity.py'
      - 'tests/test_is_p3a_gtex_21gene_real_sdY_AN_sensitivity.py'
      - 'docs/is/IS_P3A_GTEX_21GENE_SDY_AN_HETEROGENEITY_20261123.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: is-p3a-gtex-21-gene-real-sdy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-gtEX-source-gene-wise-sdY:
    strategy:
      fail-fast: false
      matrix:
        dataset: [QTD000131, QTD000171]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: 0bf646fd6f29322d17da878253f37def24c01c74
          path: legacy
          persist-credentials: false
      - name: Install existing regression test dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'openpyxl>=3.1,<4'
      - name: Test 21 real gene identities N heterogeneity and wrong-source guards
        run: |
          python -m py_compile scripts/is/qtl_original_indexed_http_range.py scripts/is/audit_p3a_gtex_21gene_real_sdY_AN_sensitivity.py
          python -m unittest discover -s tests -p 'test_is_p3a_gtex_21gene_real_sdY_AN_sensitivity.py' -v
      - name: All repository smoke regression tests
        run: bash scripts/codex_smoke_test.sh
      - name: One publisher TBI and one indexed BGZF source range per QTL dataset
        run: |
          python -m scripts.is.audit_p3a_gtex_21gene_real_sdY_AN_sensitivity \
            --dataset ${{ matrix.dataset }} \
            --manifest docs/is/evidence/IS_P3A_RESTORED_REAL_36_ASSAY_KEYS_20261122.json \
            --out artifacts/is/IS_P3A_GTEx_${{ matrix.dataset }}_Real_QTL_sdY_AN_N_HOLD.json
      - name: Preserve original source aggregate per gene only, never per-SNP effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-p3a-gtex-${{ matrix.dataset }}-21gene-real-sdy-AN-HOLD
          path: artifacts/is/IS_P3A_GTEx_${{ matrix.dataset }}_Real_QTL_sdY_AN_N_HOLD.json
          if-no-files-found: warn
          retention-days: 30
