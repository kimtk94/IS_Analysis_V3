name: IS archived candidate publication evidence audit
on:
  push:
    branches: [research/is-candidate-wide-publication-audit-20261125]
    paths: ['scripts/is/candidate_publication_audit.py','.github/workflows/is-candidate-publication-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve previously verified publisher workbook
        run: |
          python -m pip install 'openpyxl==3.1.5'
          curl -fLsS --connect-timeout 15 --max-time 75 --max-filesize 2000000 'https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-022-05165-3/MediaObjects/41586_2022_5165_MOESM4_ESM.xlsx' -o "$RUNNER_TEMP/supp.xlsx"
          python -m py_compile scripts/is/candidate_publication_audit.py
      - name: Join all frozen archived assays to published gene evidence
        run: python scripts/is/candidate_publication_audit.py --workbook "$RUNNER_TEMP/supp.xlsx" --out outputs/
      - uses: actions/upload-artifact@v4
        with:
          name: is-archived-candidate-publication-audit
          path: outputs/
          if-no-files-found: error
          retention-days: 90
