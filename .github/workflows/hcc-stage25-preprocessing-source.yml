name: HCC Stage25 Suter S5 Source Preprocessing Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage25-preprocessing-source.yml'
      - 'scripts/hcc/audit_suter_s5_preprocessing_source.py'
      - 'tests/test_hcc_stage25_suter_s5_source.py'

permissions:
  contents: read

jobs:
  verify-s5-method-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pure-Python PDF text parser
        run: python -m pip install pypdf==6.1.3
      - name: Test method-source guardrails without internet
        run: python -m unittest discover -s tests -p 'test_hcc_stage25_suter_s5_source.py' -v
      - name: Probe official public Suter supplementary PDF with SHA256 and keyword-only extraction
        run: |
          python scripts/hcc/audit_suter_s5_preprocessing_source.py \
            --out results/hcc/feasibility/stage25_suter_s5_source_review.json
      - name: Archive only aggregate source-provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage25-s5-preprocessing-source-review
          path: results/hcc/feasibility/stage25_suter_s5_source_review.json
          retention-days: 30
          if-no-files-found: error
