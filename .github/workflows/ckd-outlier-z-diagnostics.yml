name: CKD Outlier Z Diagnostics Read-only
on:
  push:
    branches: [research/thesis-evidence-freeze-20261015]
    paths:
      - 'scripts/audit_ckd_top3_outlier_z_diagnostics.py'
      - '.github/workflows/ckd-outlier-z-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/audit_ckd_top3_outlier_z_diagnostics.py
      - name: Prepare read-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ckd_audit
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ckd_audit ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ckd_audit >/dev/null
      - name: Screen harmonized Z scores and frequency outliers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 -i ~/.ssh/ckd_audit "$SSH_USER@$SSH_HOST" 'python3 -' < scripts/audit_ckd_top3_outlier_z_diagnostics.py
      - if: always()
        run: rm -f ~/.ssh/ckd_audit
