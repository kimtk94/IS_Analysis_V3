name: Ocular seven-day uniform quantification
on:
  push:
    branches: [research/top3-publication-protocol-20261128]
    paths: ['.github/workflows/ocular-seven-day-uniform-quant-20261128.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: 'pilot (fixed smallest pair) or full (reuse verified pilot; quantify remaining 14)'
        type: choice
        options: [pilot, full]
        default: pilot
      approve_full_75gb:
        description: 'Approve up to 75 GB nominal public FASTQ transfer (approximately 66.21 GB new)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ocular-seven-day-uniform-quant
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ocular-seven-day-restoration-manifest
          run-id: 46130181827
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' || inputs.scope == 'full'
        with:
          pattern: ocular-seven-day-gene-*
          run-id: 46130367058
          github-token: ${{ github.token }}
          path: reused
      - name: Freeze all run identities and resource-only pilot selection
        id: plan
        env:
          SCOPE: ${{ inputs.scope || 'audit' }}
          GH_TOKEN: ${{ github.token }}
          APPROVE: ${{ inputs.approve_full_75gb || false }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,re,urllib.parse,hashlib
          from pathlib import Path
          root=Path('docs/publication/evidence')
          def pin(name,sha):
              p=root/name
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha
              return json.loads(p.read_text())
          source=pin('top3_source_metadata_readback_20261128.json','9aef45b75089f69304c3e850fe382df70a12009f')
          old=next(j['result'] for j in source['jobs'] if j['result']['source']=='PRJNA729873')
          pairing=pin('ocular_seven_day_library_pairing_20261128.json','20b51fb9cf482d98003160c7875b07fa0666b1db')
          manifest=json.loads(Path('source/manifest.json').read_text())
          assert manifest['status']=='SOURCE_MANIFEST_VERIFIED_NOT_QUANTIFIED'
          assert manifest['live_manifest_sha256']=='65047154cdcdff77cf2b5c5ee00457d965c227612f423529b5ba8f902168a54d'
          records={x['run']:x['files'] for x in manifest['records']}
          archived={x['run_accession']:x for x in old['runs']}
          runs=[p[k] for p in pairing['pairs'] for k in ('DEX','ETH')]
          assert len(runs)==len(set(runs))==len(records)==16 and set(runs)==set(records)==set(archived)
          for run,files in records.items():
              assert set(files)=={'R1','R2','UNPAIRED'}
              rec=archived[run]
              assert sorted((x['md5'],x['bytes']) for x in files.values())==sorted(zip(rec['fastq_md5'].split(';'),map(int,rec['fastq_bytes'].split(';'))))
              for role,x in files.items():
                  p=urllib.parse.urlparse(x['url'])
                  suffix={'R1':'_1','R2':'_2','UNPAIRED':''}[role]
                  assert p.scheme=='https' and p.hostname=='ftp.sra.ebi.ac.uk' and p.path.startswith('/vol1/fastq/') and p.path.endswith('/'+run+suffix+'.fastq.gz')
                  assert re.fullmatch('[a-f0-9]{32}',x['md5']) and 0<x['bytes']<4_000_000_000
          total=lambda p:sum(records[p[k]][role]['bytes'] for k in ('DEX','ETH') for role in ('R1','R2'))
          pilot=min(pairing['pairs'],key=lambda p:(total(p),sorted([p['DEX'],p['ETH']])))
          scope=os.environ['SCOPE']
          assert scope in ('pilot','full','audit')
          if scope=='full':
              assert os.environ['APPROVE'].lower()=='true', 'full transfer requires explicit approval'
          reused={}
          pilot_runs=sorted([pilot['DEX'],pilot['ETH']])
          assert pilot_runs==['SRR14535091','SRR14535092']
          if scope in ('full','audit'):
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              assert subprocess.check_output(['git','hash-object','scripts/ocular_gene_tpm_aggregation.py'],text=True).strip()=='5f2062dd73573d4abd10548e6a043399467457f8'
              api='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/46130367058'
              get=lambda suffix:json.loads(subprocess.check_output(['gh','api',api+suffix],text=True))
              q=get('')
              assert q['conclusion']=='success' and q['head_sha']=='ac15290f4a93185d1917cbe820034915059221c0'
              assert q['path'].split('@')[0]=='.github/workflows/ocular-seven-day-uniform-quant-20261128.yml'
              assert q['head_branch']=='research/top3-publication-protocol-20261128'
              artifacts={a['name']:a for a in get('/artifacts')['artifacts']}
              pins={
                  'SRR14535091':(15259542715,'23f5db1ffa4cc969dd652964e2ef9433b8825ebd0df3f15ffb68f72ecb01bbe8','13ab69af8ea76dac33e45d03664333502e2e3c03a6844c2e58fb0796c93ba8c5'),
                  'SRR14535092':(15258743594,'ab23f9859d0605c5f8f8a73f373a5d706ef8bb00c51bec73d9cf7e2deecd9595','e9339bb061a55921c9e61ae4f7ef5f42609daea2ba5349eb3e9ce699be5d5585')}
              for r,(aid,digest,gene_sha) in pins.items():
                  name='ocular-seven-day-gene-'+r
                  a=artifacts[name]; assert a['id']==aid and not a['expired'] and a['digest']=='sha256:'+digest
                  d=Path('reused')/name
                  qc=json.loads((d/'qc.json').read_text()); summary=json.loads((d/'summary.json').read_text())
                  assert qc['run']==r and qc['status']=='TECHNICAL_COMPLETE_QC_REVIEW_REQUIRED' and qc['scientific_validation'] is False
                  assert qc['gene_summary']==summary and summary['genes']==62700
                  assert summary['tx2gene_sha256']=='cb7305d9d6c0d3f336c388554a801513c4004d163cc7035ea448a3476fdc111e'
                  assert sha(d/'gene_tpm.tsv')==summary['gene_table_sha256']==gene_sha
                  assert 'uniformly excluded' in qc['orphan_policy']
                  assert qc['unpaired_bytes_excluded']==records[r]['UNPAIRED']['bytes']
                  files={x['name']:x for x in qc['files']}
                  assert set(files)=={'reference.fa.gz','R1.fastq.gz','R2.fastq.gz'}
                  assert files['reference.fa.gz']['sha256']=='50a4143885523829c2fc8b1399b97c136ead8f313457165b855d63751a4e63f4'
                  for mate in ('R1','R2'):
                      x=files[mate+'.fastq.gz']; orig=records[r][mate]
                      assert (x['md5'],x['bytes'])==(orig['md5'],orig['bytes'])
                  assert qc['run_info']['kallisto_version']=='0.48.0'
                  reused[r]={'source_run':46130367058,'artifact_id':aid,'artifact_digest':digest,'gene_table_sha256':gene_sha,'qc_sha256':sha(d/'qc.json'),'summary_sha256':sha(d/'summary.json')}
          selected=sorted(runs if scope in ('full','audit') else pilot_runs)
          pending=sorted(set(selected)-set(reused))
          assert len(pending)==(14 if scope in ('full','audit') else 2)
          n=sum(records[r][k]['bytes'] for r in selected for k in ('R1','R2'))
          new_bytes=sum(records[r][k]['bytes'] for r in pending for k in ('R1','R2'))
          assert n<=(75_000_000_000 if scope in ('full','audit') else 9_000_000_000)
          if scope in ('full','audit'): assert n==74883257207 and new_bytes==66209894420
          plan={'scope':scope,'runs':selected,'paired_bytes':n,'new_paired_bytes':new_bytes,'pending_runs':pending,'reused':reused,'orphan_policy':'Exclude ENA unpaired singleton FASTQ consistently; paired-end technical protocol only; no treatment scores.','scientific_validation':False,'selection':'minimum combined compressed paired FASTQ size, independent of expression; full scope always all 16'}
          Path('plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          print(json.dumps(plan,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'run':pending})+'\nscope='+scope+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.scope == 'full'
        with:
          name: ocular-seven-day-gene-SRR14535091
          path: reused/ocular-seven-day-gene-SRR14535091/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.scope == 'full'
        with:
          name: ocular-seven-day-gene-SRR14535092
          path: reused/ocular-seven-day-gene-SRR14535092/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: ocular-seven-day-quant-plan
          path: plan.json
          retention-days: 90
  quantify:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ocular-seven-day-restoration-manifest
          run-id: 46130181827
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: ocular-gencode-v44-tx2gene
          run-id: 46125833980
          github-token: ${{ github.token }}
          path: mapping
      - name: Install pinned quantifier version and validate code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kallisto
          python3 scripts/ocular_gene_tpm_aggregation.py --selftest
      - name: Verify original FASTQ and uniformly quantify each run
        env:
          RUN: ${{ matrix.run }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,time,re,urllib.parse
          from pathlib import Path
          start=time.monotonic()
          run=os.environ['RUN']; assert re.fullmatch(r'SRR145350(?:7[7-9]|8[0-9]|9[0-2])',run)
          work=Path('scratch'); work.mkdir()
          outdir=Path('out'); outdir.mkdir()
          report={'run':run,'status':'HOLD','scientific_validation':False,'stage':'preflight','files':[],'orphan_policy':'uniformly excluded; no biological scores'}
          def verify_download(url,path,n,md5):
              p=urllib.parse.urlparse(url)
              assert p.scheme=='https' and p.hostname in ('ftp.sra.ebi.ac.uk','ftp.ebi.ac.uk')
              attempts=[]
              for i in range(5):
                  before=path.stat().st_size if path.exists() else 0
                  if before==n: break
                  assert 0<=before<n
                  rc=subprocess.run(['curl','--fail','--location','--proto','=https','--proto-redir','=https','--connect-timeout','30','--max-time','600','--speed-time','90','--speed-limit','1024','--max-filesize',str(n),'--continue-at','-','--output',str(path),url],timeout=625).returncode
                  after=path.stat().st_size if path.exists() else 0
                  attempts.append({'attempt':i+1,'rc':rc,'before':before,'after':after})
                  assert before<=after<=n
                  if after==n: break
                  if rc not in (5,6,7,18,28,35,52,55,56): raise ValueError('unexpected transfer result')
              assert path.stat().st_size==n
              m=hashlib.md5();s=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): m.update(block);s.update(block)
              assert m.hexdigest()==md5
              report['files'].append({'name':path.name,'bytes':n,'md5':md5,'sha256':s.hexdigest(),'attempts':attempts})
          def command(args,timeout):
              p=subprocess.run(args,check=True,text=True,capture_output=True,timeout=timeout)
              print(p.stdout[-2000:]);print(p.stderr[-2000:])
              return p.stdout
          try:
              assert shutil.disk_usage('.').free>15_000_000_000
              assert '0.48.0' in command(['kallisto','version'],30)
              m=json.loads(Path('source/manifest.json').read_text())
              assert m['live_manifest_sha256']=='65047154cdcdff77cf2b5c5ee00457d965c227612f423529b5ba8f902168a54d'
              rec=next(r['files'] for r in m['records'] if r['run']==run)
              report['stage']='reference'
              fasta=work/'reference.fa.gz'
              verify_download('https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_44/gencode.v44.transcripts.fa.gz',fasta,82601810,'a30369535731a2fdaa6add9b3530756a')
              assert report['files'][-1]['sha256']=='50a4143885523829c2fc8b1399b97c136ead8f313457165b855d63751a4e63f4'
              report['stage']='paired_fastq'
              mates=[]
              for role in ('R1','R2'):
                  f=rec[role]; path=work/(role+'.fastq.gz')
                  verify_download(f['url'],path,f['bytes'],f['md5']);mates.append(str(path))
              report['unpaired_bytes_excluded']=rec['UNPAIRED']['bytes']
              report['stage']='index'
              index=work/'reference.idx';command(['kallisto','index','-i',str(index),str(fasta)],1200)
              report['stage']='quantification'
              quant=work/'quant'
              command(['kallisto','quant','-i',str(index),'-o',str(quant),'-t','2',*mates],1800)
              info=json.loads((quant/'run_info.json').read_text())
              report['run_info']=info
              assert int(info['n_processed'])>0 and 0<int(info['n_pseudoaligned'])<=int(info['n_processed'])
              abundance=quant/'abundance.tsv'; h=hashlib.sha256(abundance.read_bytes()).hexdigest()
              report['abundance_sha256']=h
              report['stage']='gene_tpm'
              command(['python3','scripts/ocular_gene_tpm_aggregation.py','--map','mapping/tx2gene.tsv','--abundance',str(abundance),'--expected-abundance-sha',h,'--out',str(outdir)],180)
              report['gene_summary']=json.loads((outdir/'summary.json').read_text())
              assert report['gene_summary']['genes']==62700
              report['status']='TECHNICAL_COMPLETE_QC_REVIEW_REQUIRED';report['stage']='complete'
          except Exception as e:
              report['error']=type(e).__name__+': '+str(e)[:400]
          finally:
              report['elapsed_seconds']=round(time.monotonic()-start,2)
              (outdir/'qc.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
              shutil.rmtree(work,ignore_errors=True)
          if report['status']!='TECHNICAL_COMPLETE_QC_REVIEW_REQUIRED':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocular-seven-day-gene-${{ matrix.run }}
          path: |
            out/qc.json
            out/summary.json
            out/gene_tpm.tsv
          if-no-files-found: error
          retention-days: 90
  inventory:
    needs: [plan, quantify]
    if: always() && needs.plan.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ocular-seven-day-quant-plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ocular-seven-day-gene-*
          path: results
      - name: Preserve complete denominator and technical status only
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('plan/plan.json').read_text());rows=[]
          for r in p['runs']:
              d=Path('results')/('ocular-seven-day-gene-'+r)
              try:
                  q=json.loads((d/'qc.json').read_text())
                  assert q['run']==r
                  if q['status']=='TECHNICAL_COMPLETE_QC_REVIEW_REQUIRED':
                      assert hashlib.sha256((d/'gene_tpm.tsv').read_bytes()).hexdigest()==q['gene_summary']['gene_table_sha256']
                  old=p['reused'].get(r)
                  if old:
                      assert hashlib.sha256((d/'qc.json').read_bytes()).hexdigest()==old['qc_sha256']
                      assert hashlib.sha256((d/'summary.json').read_bytes()).hexdigest()==old['summary_sha256']
                      assert q['gene_summary']['gene_table_sha256']==old['gene_table_sha256']
                  rows.append({'run':r,'status':q['status'],'pseudoaligned_pct':q.get('run_info',{}).get('p_pseudoaligned'),'gene_table_sha256':q.get('gene_summary',{}).get('gene_table_sha256'),'reused_from':old})
              except Exception as e: rows.append({'run':r,'status':'HOLD_MISSING_OR_INVALID','error':str(e)[:150]})
          complete=sum(r['status']=='TECHNICAL_COMPLETE_QC_REVIEW_REQUIRED' for r in rows)
          result={'scope':p['scope'],'expected':len(rows),'technical_complete':complete,'cohort_denominator':16,'scientific_validation':False,'results':rows,'note':'No expression scores; never infer biological outcomes from partial or technical data.'}
          Path('inventory.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          if complete!=len(rows): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocular-seven-day-technical-inventory
          path: inventory.json
          retention-days: 90
