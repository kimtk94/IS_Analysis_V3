name: CKM TPMI SAIGE authentic MarkerID coordinate orientation gate
on:
  push:
    paths:
      - '.github/workflows/ckm-tpmi-saige-markerid-prefix-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saige-markerid-coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ckm-stroke-staged-actions-20261111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official SAIGE 433.21 MarkerID CHR POS and allele string semantics
        run: |
          python -m py_compile scripts/ckm_stroke/audit_tpmi_saige_markerid_prefix.py
          python -m scripts.ckm_stroke.audit_tpmi_saige_markerid_prefix \
            --out artifacts/is/TPMI43321_SAIGE_original_MarkerID_prefix_HOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-TPMI43321-SAIGE-variant-MarkerID-prefix-HOLD
          path: artifacts/is/TPMI43321_SAIGE_original_MarkerID_prefix_HOLD.json
          retention-days: 30
