name: IS EAS Japanese immune eQTL original ZIP central directory QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_japanese_eqtl_zip_central_dir.py'
      - 'tests/is/test_japanese_eqtl_zip_central_dir.py'
      - '.github/workflows/is_eas_japanese_zip_structure.yml'

permissions:
  contents: read

jobs:
  inspect-japanese-immune-source-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test public source ZIP footer and central directory parser
        run: python3 -m unittest discover -s tests/is -p 'test_japanese_eqtl_zip_central_dir.py' -v
      - name: Read only bounded original public Japanese eQTL ZIP directory bytes
        run: python3 scripts/is/audit_japanese_eqtl_zip_central_dir.py --out-dir artifacts/is_eas_japanese_zip_manifest
      - name: Archive ZIP provenance and filename inventory, no original patients
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-EAS-Japan-eQTL-remote-ZIP-directory
          path: artifacts/is_eas_japanese_zip_manifest/
          retention-days: 45
          if-no-files-found: warn
