name: CKD Top3 full LD numerical read-only audit
on:
  push:
    branches: [research/thesis-evidence-freeze-20261015]
    paths:
      - 'scripts/audit_ckd_top3_ld_numeric_readonly.py'
      - '.github/workflows/ckd-top3-ld-numeric-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.1.3
      - run: python -m py_compile scripts/audit_ckd_top3_ld_numeric_readonly.py
      - name: Configure verified SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name}" || exit 2
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ckd_ld_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ckd_ld_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ckd_ld_key >/dev/null
      - name: Read three preexisting LD matrices via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p "$RUNNER_TEMP/ckd_ld"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -i "$HOME/.ssh/ckd_ld_key")
          for gene in SDCCAG8 INHBC UMOD; do
            for extension in ld.meta.tsv ld.vars ld.bin; do
              ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
                "cat /srv/is-analysis/data/ckd/stage2c_ld/ld/$gene.$extension" \
                > "$RUNNER_TEMP/ckd_ld/$gene.$extension"
            done
          done
          python3 scripts/audit_ckd_top3_ld_numeric_readonly.py --lddir "$RUNNER_TEMP/ckd_ld"
      - name: Erase SSH key and copies
        if: always()
        run: rm -rf "$HOME/.ssh/ckd_ld_key" "$RUNNER_TEMP/ckd_ld"
