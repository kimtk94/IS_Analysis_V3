name: Early-track source schema repair
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publication/early_track_schema_repair.py'
      - '.github/workflows/early-track-schema-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [bulk, sc_TC, sc_mLN, sc_pilot, hcc_rna, hcc_protein]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3010014477b97dd9182f8eafded1897d51ceb0b4
          path: paired_helpers
      - uses: actions/checkout@v4
        with:
          ref: 9703492179f0a29ecb7a332a24d474c49a7c10f7
          path: prior_helpers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 openpyxl==3.1.5
      - run: python scripts/publication/early_track_schema_repair.py selftest
      - name: Run corrected public source gate
        env:
          MODE: ${{ matrix.mode }}
          OMP_NUM_THREADS: '2'
        run: python -u scripts/publication/early_track_schema_repair.py "$MODE" --out "evidence/$MODE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-schema-${{ matrix.mode }}
          path: evidence/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
