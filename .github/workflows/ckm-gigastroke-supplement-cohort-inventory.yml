name: CKM GIGASTROKE supplementary study cohort source inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-supplement-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aff051003c6a65421516e69956c905498848a76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory original GIGASTROKE supplementary source file IDs
        run: |
          python -m py_compile scripts/ckm_stroke/discover_gigastroke_supplements.py
          python -m scripts.ckm_stroke.discover_gigastroke_supplements \
            --out artifacts/is/GIGASTROKE_2022_supplement_inventory_HOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-GIGASTROKE-2022-original-supplement-inventory-HOLD
          path: artifacts/is/GIGASTROKE_2022_supplement_inventory_HOLD.json
          retention-days: 30
