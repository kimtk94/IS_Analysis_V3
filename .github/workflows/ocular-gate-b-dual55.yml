name: Ocular Gate B Matched 55 Donor Dual Annotation QL
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-pass-raw-umi-dual-annotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paired edgeR and compile all sources
        run: |
          python -m pip install 'numpy==1.26.4'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core r-bioc-edger r-cran-statmod r-cran-jsonlite
          python -m py_compile scripts/ocular/ocular_gate_b_55_dual_counts.py scripts/ocular/ocular_gate_b_55_compare.py
          Rscript -e 'stopifnot(requireNamespace("edgeR",quietly=TRUE));parse(file="scripts/ocular/ocular_gate_b_55_edger.R");cat("GATE_B55_R_PARSE_PASS\n")'
      - name: One pass through 18 public 10x matrices; same 55 paired donors for both labels
        run: |
          mkdir -p "$RUNNER_TEMP/ocular-b55-private" ocular-b55-public
          python -u scripts/ocular/ocular_gate_b_55_dual_counts.py \
            --private "$RUNNER_TEMP/ocular-b55-private" \
            --out ocular-b55-public/dual_annotation_source_qc.json
      - name: Run identical edgeR paired donor models per classification
        run: |
          mkdir -p ocular-b55-public/BeamA_075 ocular-b55-public/TM_Fibro
          Rscript scripts/ocular/ocular_gate_b_55_edger.R "$RUNNER_TEMP/ocular-b55-private/BeamA_075" ocular-b55-public/BeamA_075 BeamA_075
          Rscript scripts/ocular/ocular_gate_b_55_edger.R "$RUNNER_TEMP/ocular-b55-private/TM_Fibro" ocular-b55-public/TM_Fibro TM_Fibro
      - name: Summarize on same 55 donors and selected gene IDs only
        run: |
          python -u scripts/ocular/ocular_gate_b_55_compare.py \
            --beam ocular-b55-public/BeamA_075/p5_all_gene_results.tsv.gz \
            --fibro ocular-b55-public/TM_Fibro/p5_all_gene_results.tsv.gz \
            --source ocular-b55-public/dual_annotation_source_qc.json \
            --out ocular-b55-public
      - name: Delete all 55-donor individual count matrices and sample files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ocular-b55-private"
      - name: Publish aggregate-only evidence including per-gene FDR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocular-gate-b-dual55-public-results
          path: ocular-b55-public/
          retention-days: 30
          if-no-files-found: warn
