name: MASTER DEGREE 2026-11-15 official scientific source gates
on:
  push:
    branches: [research/daily-20261115-scientific-source-gates]
  pull_request:
    paths: ['.github/workflows/research-20261115-source-gates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        track: [is, glaucoma, hcc, radiomics, ocular, muscle, oral, skin]
    steps:
      - name: Run one bounded scientific prerequisite per track (fail closed)
        env:
          TRACK: ${{ matrix.track }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.parse,hashlib,re,datetime
          track=os.environ['TRACK']
          tasks={
           'is':('GIGASTROKE GCST90104540 official GWAS Catalog study record','https://www.ebi.ac.uk/gwas/rest/api/studies/GCST90104540','GCST90104540'),
           'glaucoma':('GSE313736 GEO series accession and sample metadata','https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=gds&id=GSE313736&retmode=json','GSE313736'),
           'hcc':('PDC000198 official study record and case/aliquot evidence','https://pdc.cancer.gov/pdc/api/v1/study/summary?study_id=PDC000198','PDC000198'),
           'radiomics':('IBSI official benchmark provenance and reference identification','https://ibsi.readthedocs.io/en/latest/','IBSI'),
           'ocular':('ENA PRJNA1243143 run-experiment-sample mapping and declared checksums','https://www.ebi.ac.uk/ena/portal/api/filereport?accession=PRJNA1243143&result=read_run&fields=run_accession,experiment_accession,sample_accession,fastq_md5&format=tsv','run_accession'),
           'muscle':('GTEx v10 Muscle_Skeletal tissue availability','https://gtexportal.org/api/v2/reference/tissueSiteDetail?datasetId=gtex_v10&pageSize=500','Muscle_Skeletal'),
           'oral':('GSE103322 GEO accession and donor metadata','https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=gds&id=GSE103322&retmode=json','GSE103322'),
           'skin':('Bristol GWAS public source schema and allele field availability','https://www.ebi.ac.uk/gwas/rest/api/studies?size=1','_links')
          }
          task,url,expected=tasks[track]
          out={'date_kst':'2026-11-15','track':track,'selected_task':task,'source_url':url,'status':'HOLD','scientific_pass':False,'checks':{},'blockers':[],'next_gate':''}
          nexts={
           'is':'22 chromosome full GWAS checksums, allele/build harmonization and ancestry-matched LD',
           'glaucoma':'raw integer counts, paired donor design and 9-fold leave-pool-out',
           'hcc':'authoritative PDC aliquot-to-330-TMT-channel unique crosswalk and RNA case join',
           'radiomics':'original NIfTI spacing and patient-level imaging-RNA-clinical linkage',
           'ocular':'downloaded FASTQ MD5 verification and run-timepoint-strain crosswalk',
           'muscle':'20 loci ancestry-matched LD and Muscle_Skeletal cis-eQTL colocalization',
           'oral':'18-donor expression-to-clinical endpoint crosswalk',
           'skin':'specific full summary statistics genome build, allele/effect QC and MR instruments'}
          out['next_gate']=nexts[track]
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'ScientificGateAudit/1.0','Accept':'application/json,text/tab-separated-values,text/html'})
            with urllib.request.urlopen(req,timeout=45) as response:
              data=response.read(2_000_001)
              out['checks']['http_status']=response.status
              out['checks']['content_type']=response.headers.get('Content-Type')
            if len(data)>2_000_000: raise ValueError('response exceeds bounded 2 MB; partial response is not a validated original')
            decoded=data.decode('utf-8','replace')
            out['checks']['bytes']=len(data)
            out['checks']['sha256']=hashlib.sha256(data).hexdigest()
            out['checks']['expected_marker_present']=expected.lower() in decoded.lower()
            if track=='ocular':
              lines=[x.split('\t') for x in decoded.strip().splitlines()]
              if not lines or len(lines[0])<4: raise ValueError('ENA TSV schema incomplete')
              cols=lines[0]
              rows=[dict(zip(cols,x)) for x in lines[1:] if len(x)==len(cols)]
              out['checks'].update({'run_count':len(rows),'unique_runs':len({r['run_accession'] for r in rows}),'unique_samples':len({r['sample_accession'] for r in rows}),'md5_declared':sum(bool(r['fastq_md5']) for r in rows)})
              if len(rows)!=46: out['blockers'].append('Expected 46 ENA runs; official response differs')
              if len({r['run_accession'] for r in rows})!=len(rows): out['blockers'].append('Duplicate ENA run accession')
            if not out['checks']['expected_marker_present']: out['blockers'].append('Expected official source marker missing')
            out['checks']['bounded_source_metadata_pass']=not out['blockers']
            out['blockers'].append('Metadata-only check; original full data and statistical scientific gate not independently validated')
          except Exception as exc:
            out['blockers'].append('SOURCE_UNAVAILABLE_OR_SCHEMA_MISMATCH: '+type(exc).__name__+': '+str(exc)[:350])
          pathlib.Path('gate').mkdir(exist_ok=True)
          pathlib.Path('gate/'+track+'.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'track':track,'status':out['status'],'checks':out['checks'],'blockers':out['blockers']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-gate-20261115-${{ matrix.track }}
          path: gate/${{ matrix.track }}.json
          retention-days: 30
