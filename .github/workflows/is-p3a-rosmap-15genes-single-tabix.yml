name: IS P3A ROSMAP 15 gene original TBI index and one BGZF range cis-QTL audit

on:
  push:
    paths:
      - '.github/workflows/is-p3a-rosmap-15genes-single-tabix.yml'
      - 'scripts/is/audit_p3a_rosmap_15_gene_single_tabix_qtl.py'
      - 'scripts/is/qtl_original_indexed_http_range.py'
      - 'tests/test_is_p3a_rosmap_15_gene_single_tabix_qtl.py'
      - 'tests/test_is_p3a_original_tabix_indexed_http_range.py'
      - 'docs/is/IS_P3A_ROSMAP_15GENE_SINGLE_TABIX_CIS_QTL_20261123.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: is-p3a-rosmap-15gene-one-query-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-15-genes-one-tabix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical fixture for existing repository smoke suite
        uses: actions/checkout@v4
        with:
          ref: 0bf646fd6f29322d17da878253f37def24c01c74
          path: legacy
          persist-credentials: false
      - name: Install existing smoke suite Python dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'openpyxl>=3.1,<4'
      - name: Compile and test 15-gene phenotype and original index-range source integrity
        run: |
          python -m py_compile scripts/is/audit_p3a_rosmap_15_gene_single_tabix_qtl.py scripts/is/qtl_original_indexed_http_range.py
          python -m unittest discover -s tests -p 'test_is_p3a_rosmap_15_gene_single_tabix_qtl.py' -v
          python -m unittest discover -s tests -p 'test_is_p3a_original_tabix_indexed_http_range.py' -v
      - name: Existing whole-repository regression suite
        run: bash scripts/codex_smoke_test.sh
      - name: Download publisher phenotype metadata then one TBI index and one contiguous source BGZF HTTP byte range
        env:
          IS_P3A_WRITE_PUBLIC_INDEX_DEBUG: "1"
        run: |
          python -m scripts.is.audit_p3a_rosmap_15_gene_single_tabix_qtl \
            --manifest docs/is/evidence/IS_P3A_RESTORED_REAL_36_ASSAY_KEYS_20261122.json \
            --out artifacts/is/IS_P3A_36_ROSMAP_15gene_single_tabix_original_QTL_HOLD.json
      - name: Temporary offline debugging artifact, original publisher PUBLIC TBI index only (no SNP rows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-p3a-rosmap-15genes-original-single-tabix-HOLD
          path: |
            artifacts/is/IS_P3A_36_ROSMAP_15gene_single_tabix_original_QTL_HOLD.json
            artifacts/is/QTD000434.published_public.tbi
          if-no-files-found: warn
          retention-days: 30
