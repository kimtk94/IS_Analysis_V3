name: IS ImmuNexUT E-GEAD-420 original 416 donor cohort metadata QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_EGEAD420_cohort_metadata.py'
      - 'tests/is/test_EGEAD420_cohort_metadata.py'
      - '.github/workflows/is_EGEAD420_cohort_source.yml'

permissions:
  contents: read

jobs:
  original-EGEAD420-cohort-MD5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source 416/79 cohort and no participant data leakage
        run: python3 -m unittest discover -s tests/is -p 'test_EGEAD420_cohort_metadata.py' -v
      - name: Read original 216KB public SDRF and verify published MD5
        run: python3 scripts/is/audit_EGEAD420_cohort_metadata.py --out-dir artifacts/is_EGEAD420_sdrf
      - name: Archive aggregate cohort evidence only without donor identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-ImmuNexUT-E-GEAD420-SDRF-416-cohort-original-MD5
          path: artifacts/is_EGEAD420_sdrf/
          retention-days: 60
          if-no-files-found: warn
