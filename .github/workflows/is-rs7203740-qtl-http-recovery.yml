name: IS rs7203740 bounded QTL HTTP recovery
on:
  push:
    branches: [research/is-fixed-24-subtype-extension-20261125]
    paths: ['scripts/is/rs7203740_qtl_http_recovery.py','.github/workflows/is-rs7203740-qtl-http-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 81c9a0760c185f8c6f357a70e7c199f172df1015
          path: indexed_helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact-position nominal QTL with bounded index and HTTP ranges
        run: |
          python -m pip install 'PyYAML==6.0.2' 'pysam==0.23.3'
          python -m py_compile scripts/is/rs7203740_qtl_http_recovery.py
          python -m scripts.is.rs7203740_qtl_http_recovery --out outputs/exact-allele-http-recovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-rs7203740-qtl-http-recovery
          path: outputs/
          if-no-files-found: error
          retention-days: 90
