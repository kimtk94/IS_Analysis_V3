name: Early-track compartment and HCC specificity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publication/early_track_specificity.py'
      - '.github/workflows/early-track-specificity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [PT, MET, hcc, external_hcc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9703492179f0a29ecb7a332a24d474c49a7c10f7
          path: prior_helpers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 openpyxl==3.1.5
      - run: python scripts/publication/early_track_specificity.py selftest
      - name: Run bounded specificity analysis
        env:
          MODE: ${{ matrix.mode }}
          OMP_NUM_THREADS: '2'
        run: python -u scripts/publication/early_track_specificity.py "$MODE" --out "evidence/$MODE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-specificity-${{ matrix.mode }}
          path: evidence/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
