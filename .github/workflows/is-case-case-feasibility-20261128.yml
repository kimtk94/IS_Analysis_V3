name: IS case-case alternative feasibility audit
on:
  push:
    branches: [research/top3-publication-protocol-20261128]
    paths: ['.github/workflows/is-case-case-feasibility-20261128.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dea5733170cebab70946721e4d599ddff91c13bd
          persist-credentials: false
      - name: Recalculate proposed case-case design scenarios from frozen contrasts
        run: |
          python3 - <<'PY'
          import csv,json,math,subprocess
          from pathlib import Path
          from statistics import NormalDist
          p=Path('docs/publication/evidence/is_fixed24_subtype_contrasts_20261125.json')
          m=Path('docs/publication/external_validation_20261125/marker_request.tsv')
          for path,blob in [(p,'e505329c7325c9778088ad426a635a57c4748c3b'),(m,'3035e008ddc29133c5f72008977c0dfe8a07551e')]:
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==blob
          d=json.loads(p.read_text())['result'];assert d['family']==192 and d['matched_contrasts']==158
          markers=list(csv.DictReader(m.open(),delimiter='\t'));assert len(markers)==len({x['rsid'] for x in markers})==24
          target=next(x for x in markers if x['rsid']=='rs2129981')
          assert (target['requested_effect_allele'],target['requested_other_allele'])==('T','G')
          hits={x['first'].split('_')[0]:x for x in d['significant_max_variance'] if x['rsid']=='rs2129981' and x['first'].endswith('_SVS') and x['second'].endswith('_CES')}
          assert set(hits)=={'EAS','EUR'}
          assert abs(hits['EAS']['delta']+.3118)<1e-10 and abs(hits['EUR']['delta']+.2983)<1e-10
          norm=NormalDist()
          def power(delta,p,ns,nc,family):
              var=(1/ns+1/nc)/(2*p*(1-p))
              z=norm.inv_cdf(1-.05/(2*family));u=abs(delta)/math.sqrt(var)
              return norm.cdf(u-z)+norm.cdf(-u-z)
          rows=[];registry=[]
          for ancestry,hit in sorted(hits.items()):
              for family in (24,48):
                  for p in (.05,.1,.2,.4):
                      for retain in (1.,.75,.5):
                          delta=hit['delta']*retain
                          for goal in (.8,.9):
                              z=norm.inv_cdf(1-.05/(2*family))
                              n=math.ceil((z+norm.inv_cdf(goal))**2/(p*(1-p)*delta**2)/100)*100
                              assert power(delta,p,n,n,family)>=goal-1e-10
                              assert power(delta,p,n,n,family)>=power(delta,p,n,max(1,n//2),family)
                              rows.append(dict(ancestry=ancestry,family=family,assumed_eaf=p,retained=retain,target_power=goal,delta=delta,svs=n,ces=n,achieved_power=power(delta,p,n,n,family)))
                          if ancestry=='EAS':
                              for fs,fc in ((.15,.15),(.25,.15),(.25,.25),(.35,.25)):
                                  ns,nc=math.floor(5328*fs),math.floor(5328*fc)
                                  registry.append(dict(family=family,assumed_eaf=p,retained=retain,svs_fraction=fs,ces_fraction=fc,svs=ns,ces=nc,power=power(delta,p,ns,nc,family)))
          assert len(rows)==96 and len(registry)==96
          selected=[x for x in rows if x['family']==48 and x['assumed_eaf']==.2 and x['target_power']==.8]
          example=[x for x in registry if x['family']==48 and x['assumed_eaf']==.2 and x['svs_fraction']==.25 and x['ces_fraction']==.15]
          out=dict(status='CASE_CASE_DESIGN_ONLY',scientific_validation=False,external_inputs_received=0,discovery_family=192,source_blob='e505329c7325c9778088ad426a635a57c4748c3b',fixed_marker_blob='3035e008ddc29133c5f72008977c0dfe8a07551e',assumptions='Hypothetical unrelated independent cases with mutually exclusive TOAST endpoints; additive logOR local-effect HWE information approximation; EAF and subtype fractions not observed; discovery marginal beta difference as design effect only, not measured case-case logOR. 24 per ancestry or conservative joint 48; separate from LAS family, adjust across jointly tested families. No causality or absolute disease risk. Requires prospective human review and independent ascertainment.',rows=rows,registry=registry)
          Path('design.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(dict(status=out['status'],scientific_validation=False,scenario_count=len(rows),registry_count=len(registry),selected=selected,registry_example=example),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: is-case-case-design-only
          path: design.json
          if-no-files-found: error
          retention-days: 90
