name: CKD UKB-PPP cis instruments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ckd-ukbppp-instruments.yml'
      - 'scripts/extract_ukbppp_st16_cis.py'
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Sun 2023 supplementary tables
        run: |
          set -euo pipefail
          mkdir -p /tmp/ukbppp
          URL='https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-023-06592-6/MediaObjects/41586_2023_6592_MOESM3_ESM.xlsx'
          curl -L --fail --retry 5 --retry-all-errors "$URL" -o /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx
          test -s /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx
          file /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx
          sha256sum /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx | tee /tmp/ukbppp/workbook.sha256

      - name: Extract canonical cis instruments
        run: |
          set -euo pipefail
          python3 -m pip install --quiet openpyxl
          python3 scripts/extract_ukbppp_st16_cis.py \
            --xlsx /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx \
            --output /tmp/ukbppp/UKBPPP_ST16_cis_independent.tsv.gz \
            --summary /tmp/ukbppp/UKBPPP_ST16_cis_independent.summary.json

      - name: Validate published counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          p='/tmp/ukbppp/UKBPPP_ST16_cis_independent.tsv.gz'
          with gzip.open(p,'rt') as f:
              header=f.readline().rstrip('\n').split('\t')
              rows=sum(1 for _ in f)
          assert rows == 10750, rows
          assert 'protein_id' in header and 'beta_cond' in header and 'se_cond' in header
          s=json.load(open('/tmp/ukbppp/UKBPPP_ST16_cis_independent.summary.json'))
          assert s['n_cis_signals'] == 10750
          assert s['n_unique_protein_ids'] == 1966
          assert s['n_unique_variant_ids'] == 10580
          print(json.dumps(s, indent=2))
          print('CIS_INSTRUMENT_VALIDATION_PASS')
          PY
          ls -lh /tmp/ukbppp

      - uses: actions/upload-artifact@v4
        with:
          name: ukbppp-sun2023-cis-instruments
          path: |
            /tmp/ukbppp/Sun2023_UKBPPP_Supplementary_Tables.xlsx
            /tmp/ukbppp/UKBPPP_ST16_cis_independent.tsv.gz
            /tmp/ukbppp/UKBPPP_ST16_cis_independent.summary.json
            /tmp/ukbppp/workbook.sha256
          compression-level: 0
          retention-days: 7
