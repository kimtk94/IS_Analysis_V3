name: HCC Stage60 Official Public SPA Request Transport Origin Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hcc/audit_stage60_transport_origin_ast.mjs"
      - "tests/test_hcc_stage60_transport_origin_ast.mjs"
      - ".github/workflows/hcc-stage60-transport-origin.yml"
permissions:
  contents: read
jobs:
  offline-origin-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned AST parser
        run: npm install --no-save --ignore-scripts acorn@8.15.0 acorn-walk@8.3.4
      - name: Verify source SHA, baseURL classification, request provenance and biology gates
        run: node --test tests/test_hcc_stage60_transport_origin_ast.mjs
  public-source-config-inventory:
    strategy:
      fail-fast: false
      matrix:
        mode: ["runtime", "vendor", "helpers", "download", "repository"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned AST parser
        run: npm install --no-save --ignore-scripts acorn@8.15.0 acorn-walk@8.3.4
      - name: Analyze only SHA256-pinned public JavaScript source, no backend requests
        run: |
          node scripts/hcc/audit_stage60_transport_origin_ast.mjs \
            --mode '${{ matrix.mode }}' \
            --out 'results/hcc/stage60/${{ matrix.mode }}_source_transport_ast.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-stage60-${{ matrix.mode }}-source-transport
          path: results/hcc/stage60/*.json
          if-no-files-found: warn
          retention-days: 30
