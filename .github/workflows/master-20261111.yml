name: MASTER 2026-11-11 eight independent evidence gates
on:
  pull_request:
    paths:
      - 'scripts/research/master_20261111.py'
      - '.github/workflows/master-20261111.yml'
  workflow_dispatch:
jobs:
  scientific-prerequisite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        track: [is, glaucoma, hcc, radiomics, ocular, muscle, oral, skin]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bounded official evidence verification
        run: python3 scripts/research/master_20261111.py --track ${{ matrix.track }}
      - name: Upload evidence and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-20261111-${{ matrix.track }}
          path: results/master_20261111/${{ matrix.track }}.json
          if-no-files-found: error
