name: Ocular P3 Cell State Donor Readiness

on:
  pull_request:
    paths:
      - 'scripts/ocular/ocular_p3_cellstate_readiness.py'
      - '.github/workflows/ocular-p3-cellstate-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cellstate-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/ocular/ocular_p1_integrity.py scripts/ocular/ocular_p3_cellstate_readiness.py
      - name: Calculate paired donors and annotation confidence per cell type
        run: |
          python scripts/ocular/ocular_p3_cellstate_readiness.py --output ocular-p3-cellstate-qc.json
      - name: Publish aggregate-only QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocular-p3-cellstate-qc
          path: ocular-p3-cellstate-qc.json
          retention-days: 30
          if-no-files-found: warn
