name: CKM GIGASTROKE 30-study original outcome registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ancestry-subtypes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aff051003c6a65421516e69956c905498848a76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect publisher GWAS Catalog metadata for all 30 GIGASTROKE outcomes
        run: |
          python -m py_compile scripts/ckm_stroke/audit_gigastroke_all_30_outcomes.py
          python -m scripts.ckm_stroke.audit_gigastroke_all_30_outcomes \
            --out artifacts/is/gigastroke_2022_30_outcome_registry_HOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-GIGASTROKE-30-outcome-provenance-registry-HOLD
          path: artifacts/is/gigastroke_2022_30_outcome_registry_HOLD.json
          if-no-files-found: warn
          retention-days: 30
