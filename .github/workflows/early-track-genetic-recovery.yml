name: Skin Chinese independent molecular QTL source qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publication/skin_chinese_qtl_sources.py'
      - '.github/workflows/early-track-genetic-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-qtl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [eQTL, pQTL, inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9703492179f0a29ecb7a332a24d474c49a7c10f7
          path: prior
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/publication/skin_chinese_qtl_sources.py selftest
      - env:
          MODE: ${{ matrix.mode }}
        run: python -u scripts/publication/skin_chinese_qtl_sources.py "$MODE" --out "evidence/$MODE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-skin-${{ matrix.mode }}
          path: evidence/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
