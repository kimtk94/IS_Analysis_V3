name: IS evidence guardrails
on:
  push:
    paths:
      - 'workflow/is_evidence_guardrails.py'
      - 'tests/test_is_evidence_guardrails.py'
      - 'scripts/audit_is_existing_outputs.py'
      - 'tests/test_is_existing_outputs_audit.py'
      - '.github/workflows/is-evidence-guardrails-ci.yml'
  pull_request:
    paths:
      - 'workflow/is_evidence_guardrails.py'
      - 'tests/test_is_evidence_guardrails.py'
      - 'scripts/audit_is_existing_outputs.py'
      - 'tests/test_is_existing_outputs_audit.py'
      - '.github/workflows/is-evidence-guardrails-ci.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free IS QC tests
        run: python -m unittest tests.test_is_evidence_guardrails tests.test_is_existing_outputs_audit -v
