name: MasterOmics contracts and synthetic truth
on:
  pull_request:
    paths: ['masteromics/**', 'tests/test_masteromics.py', 'projects/*.example.json', 'requirements-masteromics.lock', '.github/workflows/masteromics.yml']
  push:
    paths: ['masteromics/**', 'tests/test_masteromics.py', 'projects/*.example.json', 'requirements-masteromics.lock', '.github/workflows/masteromics.yml']
  workflow_dispatch:
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-masteromics.lock
      - run: python -m unittest discover -s tests -p test_masteromics.py -v
      - run: python -m py_compile masteromics/*.py
  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'parse(file="masteromics/analysis.R")'
