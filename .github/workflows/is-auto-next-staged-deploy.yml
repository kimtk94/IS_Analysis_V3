name: IS AUTO_NEXT staged deployment and dry-run
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/is-auto-next-staged-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: is-auto-next-staged-deploy
  cancel-in-progress: false
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    environment: is-research-readonly
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate controller source
        run: |
          python3 -m py_compile scripts/is/auto_next.py
          python3 -m unittest discover -s tests -p 'test_is_auto_next*.py' -v
      - name: Configure SSH
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/server_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -yf "$HOME/.ssh/server_key" >/dev/null
      - name: Install controller in research home and preview only
        run: |
          OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i $HOME/.ssh/server_key"
          TARGET="$SSH_USER@$SSH_HOST"
          scp $OPTS scripts/is/auto_next.py "$TARGET:is-harness/.auto_next.pending.py"
          ssh $OPTS "$TARGET" 'python3 - <<"PY"
          from pathlib import Path
          import os,py_compile
          base=Path.home()/"is-harness"
          p=base/".auto_next.pending.py"
          dest=base/"auto_next.py"
          if not (base/"github_issue_queue_worker.py").is_file():raise SystemExit("WORKER_NOT_INSTALLED")
          py_compile.compile(str(p),doraise=True)
          os.chmod(p,0o600)
          os.replace(p,dest)
          print("AUTO_NEXT_CONTROLLER_INSTALLED=PASS")
          PY
          cd "$HOME/is-harness" && python3 auto_next.py'
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
