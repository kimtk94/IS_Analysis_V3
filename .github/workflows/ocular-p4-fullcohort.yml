name: Ocular P4 Full 57 Donor BeamA Pseudobulk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible numeric dependency
        run: |
          python -m pip install 'numpy==1.26.4'
      - name: Check all P4 code and synthetic pseudobulk
        run: |
          python -m py_compile scripts/ocular/ocular_p1_integrity.py scripts/ocular/ocular_p4_pseudobulk_pilot.py scripts/ocular/ocular_p4_fullcohort.py
          python scripts/ocular/ocular_p4_pseudobulk_pilot.py --self-test
      - name: Stream all 18 original matrices and validate real paired-donor raw pseudobulk
        run: |
          python -u scripts/ocular/ocular_p4_fullcohort.py --score 0.75 --min-cells 30 --output ocular-p4-full-qc.json
      - name: Preserve aggregate-only QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocular-p4-full-qc
          path: ocular-p4-full-qc.json
          retention-days: 30
          if-no-files-found: warn
