name: IS Harness Safe Research Worker Update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/is/github_issue_queue_worker.py'
      - 'scripts/is/harness_research_jobs.py'
      - 'scripts/is/harness_science_pipeline.py'
      - 'scripts/is/harness_archived_evidence.py'
      - 'deploy/is-harness/**'
      - 'tests/test_is_harness*.py'
      - 'tests/test_is_worker*.py'
      - '.github/workflows/is-harness-safe-worker-update.yml'
  pull_request:
    paths:
      - 'deploy/is-harness/**'
      - 'tests/test_is_worker*.py'
      - '.github/workflows/is-harness-safe-worker-update.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only, or install the selected revision after stopping research timers
        required: true
        default: validate
        type: choice
        options:
          - validate
          - install

permissions:
  contents: read

concurrency:
  group: is-harness-safe-worker-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtimes
        run: |
          python -m pip install -r requirements-test.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends r-base-core
      - name: Validate the complete execution foundation
        run: bash scripts/codex_smoke_test.sh --fixture-only

  install:
    # A code push validates only. Installation is a separate explicit operation;
    # it neither starts a service nor enables a timer.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'install'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Export the immutable worker bundle
        run: |
          python3 deploy/is-harness/install_worker.py \
            --repo-root "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --export-bundle "$RUNNER_TEMP/is-harness-bundle"
      - name: Configure verified SSH identity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/is_harness_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/is_harness_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/is_harness_key >/dev/null
      - name: Install verified modules and units without activation
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o ConnectTimeout=15 -i "$HOME/.ssh/is_harness_key")
          TARGET="${SSH_USER}@${SSH_HOST}"
          REMOTE_STAGE=$(ssh "${SSH_ARGS[@]}" "$TARGET" 'umask 077; mktemp -d "$HOME/.is-harness-stage.XXXXXXXX"')
          if [[ ! "$REMOTE_STAGE" =~ ^/[a-zA-Z0-9_./-]+/\.is-harness-stage\.[a-zA-Z0-9]+$ ]]; then
            echo '::error::Unexpected remote staging path'; exit 2
          fi
          cleanup() {
            ssh "${SSH_ARGS[@]}" "$TARGET" "rm -rf -- '$REMOTE_STAGE'" || echo '::warning::Temporary staging cleanup failed'
          }
          trap cleanup EXIT
          INSTALLER_SHA256=$(sha256sum "$RUNNER_TEMP/is-harness-bundle/install_worker.py" | cut -d ' ' -f 1)
          scp "${SSH_ARGS[@]}" -r "$RUNNER_TEMP/is-harness-bundle" "$TARGET:$REMOTE_STAGE/bundle"
          ssh "${SSH_ARGS[@]}" "$TARGET" "bash -se -- '$REMOTE_STAGE' '$GITHUB_SHA' '$INSTALLER_SHA256'" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          revision="$2"
          installer_sha256="$3"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid revision'; exit 2; }
          [[ "$installer_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid installer digest'; exit 2; }
          [ "$(id -u)" -ne 0 ] || { echo 'Install as the non-root research account'; exit 2; }
          # An already active timer could run immediately after installation.
          # Query state only; an operator stops timers after examining live work.
          for unit in is-harness-queue.service is-harness-queue.timer is-auto-next.service is-auto-next.timer; do
            query_status=0
            state=$(systemctl --user show "$unit" --property=LoadState --property=ActiveState --no-pager) || query_status=$?
            load_state=$(printf '%s\n' "$state" | sed -n 's/^LoadState=//p')
            active_state=$(printf '%s\n' "$state" | sed -n 's/^ActiveState=//p')
            if [ "$query_status" -ne 0 ] && [ "$load_state:$active_state" != not-found:inactive ]; then
              echo "HOLD_SYSTEMD_UNAVAILABLE: $unit"; exit 3
            fi
            case "$load_state:$active_state" in
              loaded:inactive|loaded:failed|masked:inactive|not-found:inactive) ;;
              *) echo "HOLD_ACTIVE_OR_UNKNOWN_UNIT: $unit"; exit 3 ;;
            esac
          done
          if pgrep -f '[g]ithub_issue_queue_worker.py|[a]uto_next.py|[h]arness_research_jobs.py|[h]arness_science_pipeline.py' >/dev/null; then
            echo 'HOLD_RESEARCH_PROCESS_PRESENT'; exit 3
          else
            process_status=$?
            [ "$process_status" -eq 1 ] || { echo 'HOLD_PROCESS_INVENTORY_UNAVAILABLE'; exit 3; }
          fi
          printf '%s  %s\n' "$installer_sha256" "$stage/bundle/install_worker.py" | sha256sum --check --status
          python3 "$stage/bundle/install_worker.py" \
            --bundle-dir "$stage/bundle" --revision "$revision" \
            --execution-lock /srv/is-analysis/results/is/github_actions_runs/is_research_execution.lock
          systemctl --user daemon-reload
          echo 'WORKER_BUNDLE_INSTALLED; service and timers were not activated'
          REMOTE
      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/is_harness_key
