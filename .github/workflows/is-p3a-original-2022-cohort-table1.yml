name: IS P3A original GIGASTROKE 2022 AIS cohort Table1 EAS EUR BBJ source gate

on:
  push:
    paths:
      - '.github/workflows/is-p3a-original-2022-cohort-table1.yml'
      - 'scripts/is/audit_p3a_gigastroke_original_supp_cohort_36.py'
      - 'tests/test_is_p3a_gigastroke_original_supp_cohort_36.py'
      - 'docs/is/IS_P3A_PRIMARY_GIGASTROKE_COHORT_TABLE1_BBJ_20261122.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: is-p3a-original-2022-cohorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-original-AIS-cohort-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical research fixture for full repo smoke testing only
        uses: actions/checkout@v4
        with:
          ref: 0bf646fd6f29322d17da878253f37def24c01c74
          path: legacy
          persist-credentials: false
      - name: Historical regression workbook dependency (not used by source audit)
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Unit-test EAS BBJ, CKBB, incident-only exclusion, EUR case/control totals
        run: |
          python -m py_compile scripts/is/audit_p3a_gigastroke_original_supp_cohort_36.py
          python -m unittest discover -s tests -p 'test_is_p3a_gigastroke_original_supp_cohort_36.py' -v
      - name: Whole-repository smoke tests
        run: bash scripts/codex_smoke_test.sh
      - name: Obtain independent last main primary YAML and original source allele-N 36-group audit
        uses: actions/download-artifact@v4
        with:
          name: is-p3a-36-primary-GWAS-AIS-publisher-YAML-QTL-AN-sample-HOLD
          run-id: 45034385821
          github-token: ${{ github.token }}
          path: inputs/original
      - name: Inspect actual original 2022 Nature XLSX Table1 K AIS P controls, per-ancestry cohort rows, BBJ
        run: |
          python -m scripts.is.audit_p3a_gigastroke_original_supp_cohort_36 \
            --manifest docs/is/evidence/IS_P3A_RESTORED_REAL_36_ASSAY_KEYS_20261122.json \
            --qtl-gwas-yaml inputs/original/IS_P3A_36_primary_GWAS_metadata_QTL_AN_descriptive_HOLD.json \
            --out artifacts/is/IS_P3A_36_GIGASTROKE_2022_primary_AIS_cohort_BBJ_HOLD.json
      - name: Preserve original-public-cohort aggregated provenance, not participant or SNP effect rows
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-p3a-36-GIGASTROKE-2022-original-EAS-EUR-AIS-BBJ-cohorts-HOLD
          path: artifacts/is/IS_P3A_36_GIGASTROKE_2022_primary_AIS_cohort_BBJ_HOLD.json
          retention-days: 30
          if-no-files-found: warn
