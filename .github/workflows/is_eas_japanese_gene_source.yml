name: IS Japanese gene-level eQTL nested archive and methods original-byte QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_japanese_eqtl_gene_level_prefix.py'
      - 'tests/is/test_japanese_eqtl_gene_level_prefix.py'
      - '.github/workflows/is_eas_japanese_gene_source.yml'

permissions:
  contents: read

jobs:
  audit-gene-level-original-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test nested ZIP-gzip-TAR and original method DOCX parsing
        run: python3 -m unittest discover -s tests/is -p 'test_japanese_eqtl_gene_level_prefix.py' -v
      - name: Read only bounded source ZIP member bytes and method document
        run: python3 scripts/is/audit_japanese_eqtl_gene_level_prefix.py --out-dir artifacts/is_japanese_gene_source
      - name: Archive only original file schema and methods (no patient data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-Japan-gene-level-original-byte-methods
          path: artifacts/is_japanese_gene_source/
          retention-days: 60
          if-no-files-found: warn
