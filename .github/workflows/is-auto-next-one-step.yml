name: IS AUTO_NEXT bounded one-step executor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['.github/research-queue/is-auto-next-step.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: is-auto-next-one-step
  cancel-in-progress: false
jobs:
  one-step:
    runs-on: ubuntu-latest
    environment: is-research-readonly
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate strictly bounded request
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('.github/research-queue/is-auto-next-step.json').read_text())
          if obj!={"schema_version":1,"job":"is-auto-next-one-step","non_live_only":True,"max_steps":1,"approval":"IS_RESEARCH_ONLY"}:
              raise SystemExit("UNAUTHORIZED_AUTO_NEXT_REQUEST")
          print("AUTO_NEXT_REQUEST=PASS")
          PY
      - name: Configure SSH
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then exit 1; fi
          done
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/server_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -yf "$HOME/.ssh/server_key" >/dev/null
      - name: SSH connectivity gate (no scientific work)
        id: connectivity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o IdentitiesOnly=yes -o ForwardAgent=no -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" 'printf "IS_HARNESS_SSH_OK\\n"' > ssh-probe.log 2>&1; then
              grep -q 'IS_HARNESS_SSH_OK' ssh-probe.log
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              echo "AUTO_NEXT_CONNECTIVITY=PASS"
              exit 0
            fi
            echo "AUTO_NEXT_CONNECTIVITY_RETRY=$attempt"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::AUTO_NEXT_INFRA_BLOCKED_SSH; state and science results unchanged"
      - name: Run at most one next task if reachable
        if: steps.connectivity.outputs.reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" 'cd "$HOME/is-harness" && python3 - <<"PY"
          import json,subprocess,sys
          def call(*args):
              p=subprocess.run([sys.executable,"auto_next.py",*args],capture_output=True,text=True,timeout=280)
              if p.returncode:raise SystemExit(p.stderr[-1000:] or ("AUTO_NEXT_CODE_EXIT="+str(p.returncode)))
              return json.loads(p.stdout)
          before=call()
          print("AUTO_NEXT_PREVIEW="+json.dumps(before,sort_keys=True),flush=True)
          if before.get("status")=="DRY_RUN":
              result=call("--run")
              print("AUTO_NEXT_EXECUTION="+json.dumps({k:v for k,v in result.items() if k!="output_excerpt"},sort_keys=True),flush=True)
              if result.get("status") not in ("PASS","DEFERRED_LOCK_BUSY"):
                  raise SystemExit("AUTO_NEXT_REVIEW_REQUIRED")
          else:
              print("AUTO_NEXT_NO_RUN_REASON="+str(before.get("status")),flush=True)
          after=call()
          print("AUTO_NEXT_AFTER_STATUS="+str(after.get("status")),flush=True)
          PY'
      - name: Record infrastructure blocker
        if: steps.connectivity.outputs.reachable == 'false'
        run: echo 'AUTO_NEXT_INFRA_BLOCKED_SSH; no task was attempted, scientific state not changed'
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
