name: IS EAS ImmuNexUT E-GEAD-420 original full-nominal ZIP64 source QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_EGEAD420_nominal_zip64.py'
      - 'tests/is/test_EGEAD420_nominal_zip64.py'
      - '.github/workflows/is_EGEAD420_nominal_source_qc.yml'

permissions:
  contents: read

jobs:
  original-east-asian-nominal-all-cis-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline synthetic ZIP64 parser, exact original source name and manifest MD5 tests
        run: python3 -m unittest discover -s tests/is -p 'test_EGEAD420_nominal_zip64.py' -v
      - name: Read original 43GB public ZIP64 source metadata and first nominal TAR bytes via HTTPS Range only
        run: python3 scripts/is/audit_EGEAD420_nominal_zip64.py --out-dir artifacts/is_EGEAD420_pilot
      - name: Save public source byte evidence; no original 43GB bulk export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-ImmuNexUT-E-GEAD-420-original-ZIP64-nominal-source-evidence
          path: artifacts/is_EGEAD420_pilot/
          retention-days: 60
          if-no-files-found: warn
