name: IS GTEx v8 tissue specificity pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_gtex_tissue_specificity.py'
      - 'tests/is/test_gtex_tissue_specificity.py'
      - '.github/workflows/is_gtex_tissue_pilot.yml'

permissions:
  contents: read

jobs:
  gtex-median-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test specificity calculation and GCT shape
        run: python3 -m unittest discover -s tests/is -p 'test_gtex_tissue_specificity.py' -v
      - name: Compute GTEx v8 target gene specificity across all tissues
        run: python3 scripts/is/audit_gtex_tissue_specificity.py --out-dir artifacts/is_gtex_specificity
      - name: Preserve only public expression aggregates and audit status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-gtex-v8-tissue-specificity
          path: artifacts/is_gtex_specificity/
          retention-days: 30
          if-no-files-found: warn
