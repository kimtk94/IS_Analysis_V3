name: IS stroke GSE331114 all 8 sample gene count QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_stroke_gse331114_full_8.py'
      - 'tests/is/test_stroke_gse331114_full_8.py'
      - '.github/workflows/is_stroke_full8_gene_qc.yml'

permissions:
  contents: read

jobs:
  stroke-eight-sample-genes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [AIS, Control]
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify raw Matrix Market and gene summarization guardrails
        run: python3 -m unittest discover -s tests/is -p 'test_stroke_gse331114_full_8.py' -v
      - name: Process public GEO sample sparse matrix in temporary storage
        run: python3 scripts/is/audit_stroke_gse331114_full_8.py --group ${{ matrix.group }} --index ${{ matrix.index }} --out-dir artifacts/is_stroke_gene_qc
      - name: Upload per-sample public aggregate data and status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-gse331114-${{ matrix.group }}-${{ matrix.index }}
          path: artifacts/is_stroke_gene_qc/
          retention-days: 30
          if-no-files-found: warn
