name: Ocular 14-day commercial lot source gate
on:
  push:
    branches: [research/ocular-exvivo-fixed-panel-20261125]
    paths: ['scripts/ocular_14d_lot_source_gate.py','.github/workflows/ocular-14d-lot-source-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6941039ae9d9de79793048d433536f7c7437d744
          path: frozen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 32bdfc54c2b6418cee6acd65e6d39fac878864ca
          path: prior
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve bounded public platform-specific inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fLsS --connect-timeout 15 --max-time 60 --max-filesize 4000000 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14912728421/zip" -o "$RUNNER_TEMP/panel.zip"
          for platform in GPL14550 GPL17077; do
            echo "$platform matrix"
            curl -fLsS --connect-timeout 15 --max-time 60 --max-filesize 12000000 "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE65nnn/GSE65240/matrix/GSE65240-$platform"_series_matrix.txt.gz -o "$RUNNER_TEMP/$platform-matrix.gz" || true
            echo "$platform annotation"
            # GEO documented self scope: only the platform record, not its family.
            if curl -fLsS --connect-timeout 15 --max-time 100 --max-filesize 45000000 "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=$platform&targ=self&view=full&form=text" -o "$RUNNER_TEMP/$platform-annot.soft"; then
              sha256sum "$RUNNER_TEMP/$platform-annot.soft"
              gzip -n -c "$RUNNER_TEMP/$platform-annot.soft" > "$RUNNER_TEMP/$platform-annot.gz"
            fi
            sleep 2
          done
      - name: Source identity and blinded common candidate coverage
        run: |
          export PYTHONPATH="$PWD/frozen/scripts:$PWD/prior/scripts"
          python -m py_compile scripts/ocular_14d_lot_source_gate.py
          python scripts/ocular_14d_lot_source_gate.py --root "$RUNNER_TEMP" --out outputs/source-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocular-14d-lot-source-gate
          path: outputs/
          if-no-files-found: error
          retention-days: 90
