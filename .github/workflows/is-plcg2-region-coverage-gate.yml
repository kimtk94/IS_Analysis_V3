name: IS PLCG2 regional coverage gate
on:
  push:
    branches: [research/is-fixed-24-subtype-extension-20261125]
    paths: ['scripts/is/plcg2_region_coverage_gate.py','.github/workflows/is-plcg2-region-coverage-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  region-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 81c9a0760c185f8c6f357a70e7c199f172df1015
          path: indexed_helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: is24-study-*
          path: inputs/prior
          run-id: 45534891070
          github-token: ${{ github.token }}
      - name: Bounded region source and exact allele coverage only
        run: |
          python -m pip install 'PyYAML==6.0.2' 'pysam==0.23.3' 'pyliftover==0.4.1'
          for study in EAS_CES EAS_SVS EUR_CES EUR_SVS; do
            mv "inputs/prior/is24-study-$study" "inputs/prior/$study"
          done
          python -m py_compile scripts/is/plcg2_region_coverage_gate.py
          python -m scripts.is.plcg2_region_coverage_gate --evidence docs/publication/evidence --prior inputs/prior --out outputs/plcg2-region-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-plcg2-region-coverage
          path: outputs/
          if-no-files-found: error
          retention-days: 90
