name: CKM BBJ PheWeb IS exact variant independent audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bbj-is-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aff051003c6a65421516e69956c905498848a76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify BBJ exact variant and explicit ischemic stroke phenocode
        run: |
          python -m py_compile scripts/ckm_stroke/query_bbj_pheweb_ais_single_locus.py
          python -m scripts.ckm_stroke.query_bbj_pheweb_ais_single_locus --out artifacts/tpmi/bbj_PheWeb_IS_rs187759247_original_outcome_HOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ckm-BBJ-IS-exact-variant-original-outcome-HOLD
          path: artifacts/tpmi/bbj_PheWeb_IS_rs187759247_original_outcome_HOLD.json
          if-no-files-found: warn
          retention-days: 30
