name: IS Harness 5-Minute Research Refresh

on:
  schedule:
    # Every 5 minutes. GitHub may delay or skip some scheduled runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/is-harness-daily-research.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: is-harness-5minute-research-refresh
  cancel-in-progress: false

jobs:
  enqueue-research-refresh:
    if: github.repository == 'kimtk94/IS_Analysis_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register at most one research refresh per 5-minute slot
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'kimtk94';
            const repo = 'IS_Analysis_V3';
            // KST is UTC+09:00 without DST. Use the latest 5-minute slot.
            // Keep a stable title even when the scheduled workflow starts late.
            const slot = new Date(Date.now() + 9 * 60 * 60 * 1000);
            const minute = slot.getUTCMinutes();
            slot.setUTCMinutes(Math.floor(minute / 5) * 5, 0, 0);
            const dayKst = slot.toISOString().slice(0, 10);
            const timeKst = slot.toISOString().slice(11, 16);
            const title = 'IS Harness scheduled research refresh ' + dayKst + ' ' + timeKst + ' KST';
            const body = JSON.stringify({ operation: 'research-refresh' });

            // Keep a stable issue title per five-minute slot for retries and deduplication.
            const recent = await github.rest.issues.listForRepo({
              owner, repo, state: 'all', per_page: 100,
              sort: 'created', direction: 'desc',
            });
            const existing = recent.data.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              core.notice('Slot already registered: #' + existing.number + ' (' + title + ')');
              return;
            }

            // If the worker is offline or a previous research refresh is still
            // queued/running, do not accumulate potentially unbounded backlog.
            for (const label of ['is-harness-queued', 'is-harness-running']) {
              const pending = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: label, per_page: 100,
              });
              const existingResearchJob = pending.data.find(issue => {
                if (issue.pull_request) return false;
                try {
                  return JSON.parse(issue.body || '{}').operation === 'research-refresh';
                } catch { return false; }
              });
              if (existingResearchJob) {
                core.warning('Skipped slot ' + title + ': existing research refresh #' +
                  existingResearchJob.number + ' is ' + label);
                return;
              }
            }

            const created = await github.rest.issues.create({
              owner, repo, title, body,
              labels: ['is-harness-queued'],
            });
            core.notice('5-minute research refresh queued: #' + created.data.number);
            core.notice(created.data.html_url);
