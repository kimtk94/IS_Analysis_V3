name: IS Harness 5-Minute Research Refresh

on:
  schedule:
    # Every 5 minutes. GitHub may delay or skip some scheduled runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/is-harness-daily-research.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: is-harness-5minute-research-refresh
  cancel-in-progress: false

jobs:
  enqueue-research-refresh:
    if: github.repository == 'kimtk94/IS_Analysis_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register at most one research refresh per 5-minute slot
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'kimtk94';
            const repo = 'IS_Analysis_V3';
            // KST is UTC+09:00 without DST. Use the latest 5-minute slot.
            // Keep a stable title even when the scheduled workflow starts late.
            const slot = new Date(Date.now() + 9 * 60 * 60 * 1000);
            const minute = slot.getUTCMinutes();
            slot.setUTCMinutes(Math.floor(minute / 5) * 5, 0, 0);
            const dayKst = slot.toISOString().slice(0, 10);
            const timeKst = slot.toISOString().slice(11, 16);
            const title = 'IS Harness scheduled research refresh ' + dayKst + ' ' + timeKst + ' KST';
            const body = JSON.stringify({ operation: 'research-refresh' });

            // Keep a stable issue title per five-minute slot for retries and deduplication.
            const recent = await github.rest.issues.listForRepo({
              owner, repo, state: 'all', per_page: 100,
              sort: 'created', direction: 'desc',
            });
            const existing = recent.data.find(issue => !issue.pull_request && issue.title === title);
            // If the worker is offline or a previous research refresh is still
            // queued/running, hold the queue. Stale work must be visibly failed,
            // not reported as a successful research refresh. Never requeue it.
            const pendingResearchJobs = [];
            for (const label of ['is-harness-queued', 'is-harness-running']) {
              const response = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: label, per_page: 100,
                sort: 'created', direction: 'asc',
              });
              const pending = response.data;
              if (pending.length >= 100) {
                core.setFailed('HOLD_QUEUE_INVENTORY_LIMIT: inspect the ' + label +
                  ' backlog before continuing; no issue was changed.');
                return;
              }
              const researchJobs = pending.filter(issue => {
                if (issue.pull_request) return false;
                try {
                  return JSON.parse(issue.body || '{}').operation === 'research-refresh';
                } catch { return false; }
              });
              for (const issue of researchJobs) {
                const timestamp = label === 'is-harness-running' ? issue.updated_at : issue.created_at;
                const ageMs = Date.now() - Date.parse(timestamp);
                if (!Number.isFinite(ageMs) || ageMs < 0 || ageMs >= 60 * 60 * 1000) {
                  core.setFailed('HOLD_STALE_REQUEST: research refresh #' + issue.number +
                    ' is ' + label + '; inspect the worker and request state before manual recovery. ' +
                    'No issue was changed and no replacement was queued.');
                  return;
                }
                pendingResearchJobs.push({ issue, label });
              }
            }
            if (pendingResearchJobs.length) {
              const { issue, label } = pendingResearchJobs[0];
              core.warning('Skipped slot ' + title + ': existing research refresh #' +
                issue.number + ' is ' + label);
              return;
            }
            if (existing) {
              core.notice('Slot already registered: #' + existing.number + ' (' + title + ')');
              return;
            }

            // Server watches local source metadata; GitHub is an hourly failover.
            // Check pending/stale work first so a recent success cannot hide it.
            const latestPassed = recent.data.find(issue =>
              !issue.pull_request &&
              issue.labels?.some(l => l.name === 'is-harness-done') &&
              (() => { try { return JSON.parse(issue.body||'{}').operation === 'research-refresh'; } catch {return false;} })()
            );
            if (latestPassed && (Date.now() - Date.parse(latestPassed.updated_at)) < 60 * 60 * 1000) {
              core.notice('Recent validated research refresh exists; server watches input changes. No duplicate Issue.');
              return;
            }

            const created = await github.rest.issues.create({
              owner, repo, title, body,
              labels: ['is-harness-queued'],
            });
            core.notice('5-minute research refresh queued: #' + created.data.number);
            core.notice(created.data.html_url);
