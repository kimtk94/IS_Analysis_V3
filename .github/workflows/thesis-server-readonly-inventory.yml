name: Thesis read-only server evidence inventory
on:
  push:
    branches:
      - research/thesis-evidence-freeze-20261015
    paths:
      - "scripts/audit_thesis_server_manifest.py"
      - ".github/workflows/thesis-server-readonly-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: thesis-server-readonly-inventory
  cancel-in-progress: false

jobs:
  read-only-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile read-only inspector
        run: python -m py_compile scripts/audit_thesis_server_manifest.py
      - name: Verify preconfigured SSH credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing read-only SSH secret: $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/thesis_readonly_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/thesis_readonly_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/thesis_readonly_key" >/dev/null || exit 1
      - name: Inspect existing aggregate results without remote modifications
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -i "$HOME/.ssh/thesis_readonly_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' \
            < scripts/audit_thesis_server_manifest.py \
            > "$RUNNER_TEMP/thesis_readonly_inventory.json"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Read-only research server inventory failed"
            exit "$code"
          fi
      - name: Report only nonparticipant aggregate completeness
        run: |
          python3 - "$RUNNER_TEMP/thesis_readonly_inventory.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["kind"]=="READ_ONLY_AGGREGATE_FILE_INVENTORY"
          assert d["no_participant_level_data_collected"] is True
          assert d["scientific_validation_complete"] is False
          print("REMOTE_INVENTORY_RETRIEVED",d["audit_utc"])
          print("SERVER_GIT_SHA",d["server_git"].get("sha", "UNKNOWN"))
          print("SERVER_GIT_BRANCH",d["server_git"].get("branch", "UNKNOWN"))
          print("FILES",d["file_status_counts"])
          for name,item in d["sources"].items():
              meta=item.get("aggregate", {})
              print("FILE",name,item["status"],"rows=",meta.get("rows"),"sha256=",item.get("sha256", ""))
              if name=="CKD_9GENE_MATRIX":
                  print("CKD_GENE_SET_EXACT",meta.get("ckd_9_gene_set_exact"))
                  print("CKD_FIELDS_PRESENT",meta.get("field_present_counts",{}))
          PY
      - name: Securely delete temporary SSH credentials and private inventory
        if: always()
        run: |
          rm -f "$HOME/.ssh/thesis_readonly_key" "$RUNNER_TEMP/thesis_readonly_inventory.json"
