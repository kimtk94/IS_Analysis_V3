name: Thesis read-only server evidence inventory
on:
  push:
    branches:
      - research/thesis-evidence-freeze-20261015
    paths:
      - "scripts/audit_thesis_server_manifest.py"
      - "scripts/audit_thesis_evidence_freeze.py"
      - "scripts/plot_ckd_manuscript_fig3.py"
      - "scripts/plot_ckd_manuscript_fig2_fig4.py"
      - ".github/workflows/thesis-server-readonly-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: thesis-server-readonly-inventory
  cancel-in-progress: false

jobs:
  read-only-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: is-research-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile read-only inspector
        run: python -m py_compile scripts/audit_thesis_server_manifest.py
      - name: Verify preconfigured SSH credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing read-only SSH secret: $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/thesis_readonly_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/thesis_readonly_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/thesis_readonly_key" >/dev/null || exit 1
      - name: Inspect existing aggregate results without remote modifications
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -i "$HOME/.ssh/thesis_readonly_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' \
            < scripts/audit_thesis_server_manifest.py \
            > "$RUNNER_TEMP/thesis_readonly_inventory.json"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Read-only research server inventory failed"
            exit "$code"
          fi
      - name: Report only nonparticipant aggregate completeness
        run: |
          python3 - "$RUNNER_TEMP/thesis_readonly_inventory.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["kind"]=="READ_ONLY_AGGREGATE_FILE_INVENTORY"
          assert d["no_participant_level_data_collected"] is True
          assert d["scientific_validation_complete"] is False
          print("REMOTE_INVENTORY_RETRIEVED",d["audit_utc"])
          print("SERVER_GIT_SHA",d["server_git"].get("sha", "UNKNOWN"))
          print("SERVER_GIT_BRANCH",d["server_git"].get("branch", "UNKNOWN"))
          print("FILES",d["file_status_counts"])
          for name,item in d["sources"].items():
              meta=item.get("aggregate", {})
              print("FILE",name,item["status"],"rows=",meta.get("rows"),"sha256=",item.get("sha256", ""))
              if name=="CKD_9GENE_MATRIX":
                  print("CKD_GENE_SET_EXACT",meta.get("ckd_9_gene_set_exact"))
                  print("CKD_FIELDS_PRESENT",meta.get("field_present_counts",{}))
          PY
      - name: Freeze existing full IS and CKD matrices on ephemeral runner only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p "$RUNNER_TEMP/thesis_input"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -i "$HOME/.ssh/thesis_readonly_key")
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            'cat /srv/is-analysis/results/is/audits/is_existing_2225_evidence_matrix_20261011_v1/IS_2225_GENE_EVIDENCE_MATRIX.tsv' \
            > "$RUNNER_TEMP/thesis_input/is_genes.tsv" || exit 2
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            'cat /srv/is-analysis/results/is/audits/is_existing_2225_evidence_matrix_20261011_v1/IS_2425_GENE_REGION_EVIDENCE.tsv' \
            > "$RUNNER_TEMP/thesis_input/is_regions.tsv" || exit 2
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            'cat /srv/is-analysis/results/is/audits/is_existing_2225_evidence_matrix_20261011_v1/IS_GENE_EVIDENCE_MATRIX_MANIFEST.json' \
            > "$RUNNER_TEMP/thesis_input/is_manifest.json" || exit 2
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            'cat /srv/is-analysis/results/ckd/integrated_evidence/CKD_9GENE_EVIDENCE_MATRIX.tsv' \
            > "$RUNNER_TEMP/thesis_input/ckd_9gene.tsv" || exit 2
          python3 - "$RUNNER_TEMP/thesis_input" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          expected={
            "is_genes.tsv":"591cc54583022cc7e09626cf6343b06a1534928f4d584d90e70bee43ade2ff94",
            "is_regions.tsv":"3ad82780744c4ab571d44fbcf8c421860c0ea0719c6bd38c3a32b2bceb3f9560",
            "is_manifest.json":"2753b22a8a6633bb00302083aeb55ee4e3b2493a4a09f7af9a7ead958d5ece94",
            "ckd_9gene.tsv":"32fa0475461b206c48295833acfc3075bfb24d89c322b5f9be554b1883a2f3d3",
          }
          for name,digest in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit("FROZEN_SOURCE_CHECKSUM_MISMATCH: "+name)
          print("ALL_FOUR_REMOTE_SOURCE_HASHES_VERIFIED")
          PY
          python3 scripts/audit_thesis_evidence_freeze.py \
            --is-input "$RUNNER_TEMP/thesis_input/is_genes.tsv" \
            --is-regions "$RUNNER_TEMP/thesis_input/is_regions.tsv" \
            --is-manifest "$RUNNER_TEMP/thesis_input/is_manifest.json" \
            --ckd-input "$RUNNER_TEMP/thesis_input/ckd_9gene.tsv" \
            --out-dir "$RUNNER_TEMP/thesis_frozen"
          python3 - "$RUNNER_TEMP/thesis_frozen" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          info=json.loads((root/"EVIDENCE_FREEZE_PROVENANCE.json").read_text())
          assert not info["scientific_validation_completed"]
          assert info["coverage"]["IS"]["gene_rows"] == 2225
          assert info["coverage"]["CKD"]["candidate_rows"] == 9
          print("IS_CKD_EXISTING_SOURCE_FREEZE_PASS")
          print("COVERAGE",json.dumps(info["coverage"],sort_keys=True))
          with (root/"CKD_EVIDENCE_READINESS_FROZEN.tsv").open(newline="") as f:
              rows=list(csv.DictReader(f,delimiter="\t"))
          for row in rows:
              flags=row["limitations"].split(";")
              print("CKD_CANDIDATE",row["gene_symbol"],
                    "EUROPEAN_ABF",row["eur_abf_h4"]!="NOT_ASSESSED",
                    "EAS_EGFR_ABF",row["eas_egfr_abf_h4"]!="NOT_ASSESSED",
                    "CELL_CONTEXT",row["top_cell_type"]!="NOT_ASSESSED",
                    "EUR_MULTISIGNAL_UNRESOLVED", "EUR_MULTISIGNAL_UNRESOLVED" in flags,
                    "EUR_ABF_SUSIE_DISCORDANT", "EUR_ABF_SUSIE_DISCORDANT" in flags,
                    "EAS_DUAL_LD_UNRESOLVED", "EAS_DUAL_LD_UNRESOLVED" in flags,
                    "KOGES_LONGITUDINAL_VALIDATED",row["koges_longitudinal_validated"])
          PY
      - name: Create real-source CKD Figure 3 (ephemeral runner, SHA pinned)
        run: |
          python3 -m pip install matplotlib==3.9.2
          python3 scripts/plot_ckd_manuscript_fig3.py \
            --input "$RUNNER_TEMP/thesis_input/ckd_9gene.tsv" \
            --out "$RUNNER_TEMP/ckd_fig3" "$RUNNER_TEMP/ckd_fig2_fig4" \
            --sha256 32fa0475461b206c48295833acfc3075bfb24d89c322b5f9be554b1883a2f3d3
          test -s "$RUNNER_TEMP/ckd_fig3/CKD_FIG3_EUR_ABF_VS_SUSIE.svg"
          test -s "$RUNNER_TEMP/ckd_fig3/CKD_FIG3_EVIDENCE.tsv"
      - name: Upload aggregate-only manuscript Figure 3
        uses: actions/upload-artifact@v4
        with:
          name: CKD-FIG3-EUR-ABF-SUSIE-SHA32fa0475
          path: ${{ runner.temp }}/ckd_fig3/
          if-no-files-found: error
          retention-days: 30
      - name: Create real-source CKD Figures 2 and 4
        run: |
          python3 scripts/plot_ckd_manuscript_fig2_fig4.py \
            --input "$RUNNER_TEMP/thesis_input/ckd_9gene.tsv" \
            --out "$RUNNER_TEMP/ckd_fig2_fig4" \
            --sha256 32fa0475461b206c48295833acfc3075bfb24d89c322b5f9be554b1883a2f3d3
      - name: Upload aggregate-only manuscript Figures 2 and 4
        uses: actions/upload-artifact@v4
        with:
          name: CKD-FIG2-FIG4-SHA32fa0475
          path: ${{ runner.temp }}/ckd_fig2_fig4/
          if-no-files-found: error
          retention-days: 30
      - name: Securely delete temporary SSH credentials and private inventory
        if: always()
        run: |
          rm -f "$HOME/.ssh/thesis_readonly_key" "$RUNNER_TEMP/thesis_readonly_inventory.json"
          rm -rf "$RUNNER_TEMP/thesis_input" "$RUNNER_TEMP/thesis_frozen" "$RUNNER_TEMP/ckd_fig3"
