name: IS EBI BLUEPRINT real nominal eQTL row-level QC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_ebi_eqtl_nominal_real_rows.py'
      - 'tests/is/test_ebi_eqtl_nominal_real_rows.py'
      - '.github/workflows/is_ebi_eqtl_nominal_real_rows.yml'

permissions:
  contents: read

jobs:
  public-nominal-source-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject invalid eQTL beta-se/MAF and false cis-complete sources
        run: python3 -m unittest discover -s tests/is -p 'test_ebi_eqtl_nominal_real_rows.py' -v
      - name: Read real public BLUEPRINT nominal association row prefix
        run: python3 scripts/is/audit_ebi_eqtl_nominal_real_rows.py --out-dir artifacts/is_ebi_nominal_real_rows
      - name: Record only schema/row integrity, no inferred stroke associations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-EBI-BLUEPRINT-original-nominal-association-rows
          path: artifacts/is_ebi_nominal_real_rows/
          retention-days: 45
          if-no-files-found: warn
