name: IS EAS outcome GWAS original effect allele frequency quality audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/is/audit_EAS_GWAS_EAF_original.py'
      - 'tests/is/test_EAS_GWAS_EAF_original.py'
      - '.github/workflows/is_EAS_GWAS_EAF_original.yml'

permissions:
  contents: read

jobs:
  original-EAS-outcome-frequency-QC:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test frequency boundaries, missing values, entire 22 chromosome accounting
        run: python3 -m unittest discover -s tests/is -p 'test_EAS_GWAS_EAF_original.py' -v
      - name: Publisher-MD5 validated full original EAS IS GWAS EAF / MAF aggregate scan
        run: python3 scripts/is/audit_EAS_GWAS_EAF_original.py --out-dir artifacts/is_EAS_GWAS_eaf_QC
      - name: Preserve outcome-GWAS technical EAF evidence not eQTL MAF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-EAS-GIGASTROKE-publisher-MD5-GWAS-EAF-completeness
          path: artifacts/is_EAS_GWAS_eaf_QC/
          retention-days: 60
          if-no-files-found: warn
