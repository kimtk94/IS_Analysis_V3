name: HCC Stage36 Official Gao GCT Source Access and Annotation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage36-pdc-gct-annotation-gate.yml'
      - 'scripts/hcc/audit_stage36_original_pdc_gct_source.py'
      - 'tests/test_hcc_stage36_gct_source_gate.py'

permissions:
  contents: read

concurrency:
  group: hcc-stage36-gct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-GCT-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source GCT alias identity and no patient inference
        run: python -m unittest discover -s tests -p 'test_hcc_stage36_gct_source_gate.py' -v
      - name: Check official PDC study and quantitative portal source links
        run: |
          python scripts/hcc/audit_stage36_original_pdc_gct_source.py \
            --out results/hcc/stage36/pdc_gct_source_link_audit.json \
            --review-out results/hcc/stage36/pdc_gct_source_gate.json
      - name: Upload only anonymous source access and HOLD verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage36-pdc-GCT-source-evidence
          path: results/hcc/stage36/*.json
          retention-days: 30
          if-no-files-found: error
