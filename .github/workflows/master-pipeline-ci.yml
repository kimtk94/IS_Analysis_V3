name: master-pipeline-ci

on:
  push:
    paths:
      - "config/master_*.json"
      - "config/ckd/master_stage_map.tsv"
      - "docs/MASTER_PIPELINE.md"
      - "docs/CKD_MASTER_END_TO_END.md"
      - "scripts/run_master_*"
      - "scripts/summarize_master_*"
      - "scripts/validate_master_pipeline.py"
      - "scripts/audit_ckd_master_existing_outputs.py"
      - "tests/test_master_*"
      - "workflow/run_master.py"
      - "server/ckd_master_end_to_end_audit.sh"
      - ".github/workflows/master-pipeline-ci.yml"
  pull_request:
    paths:
      - "config/master_*.json"
      - "docs/MASTER_PIPELINE.md"
      - "scripts/run_master_*"
      - "scripts/summarize_master_*"
      - "scripts/validate_master_pipeline.py"
      - "tests/test_master_*"
      - "workflow/run_master.py"
      - ".github/workflows/master-pipeline-ci.yml"
  workflow_dispatch:

jobs:
  validate-master-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate disease configs
        run: python scripts/validate_master_pipeline.py config/master_ckd.json config/master_is.json
      - name: Run MASTER tests
        run: >
          python -m pytest -q
          tests/test_master_pipeline.py
          tests/test_master_runner.py
          tests/test_master_mr_robustness.py
          tests/test_master_mr.py
          tests/test_master_susie_contract.py
          tests/test_master_cross_ancestry.py
          tests/test_master_cross_platform.py
          tests/test_master_transcriptomics.py
          tests/test_master_phenotype_matrix.py
          tests/test_master_risk_factor.py
          tests/test_master_individual_validation_contract.py
          tests/test_master_individual_summary.py
          tests/test_master_localization.py
          tests/test_master_phewas.py
          tests/test_master_druggability.py
          tests/test_master_evidence_integration.py
          tests/test_master_dataset_registry.py
          tests/test_master_exposure_normalize.py
          tests/test_master_instrument_qc.py
          tests/test_ckd_master_bridge.py
      - name: Dry-run CKD and IS stages 0-6
        run: |
          python workflow/run_master.py --disease ckd --stages 0-6 --dry-run
          python workflow/run_master.py --disease is --stages 0-6 --dry-run
