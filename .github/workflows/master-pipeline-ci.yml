name: master-pipeline-ci

on:
  push:
    paths:
      - "config/master_*.json"
      - "docs/MASTER_PIPELINE.md"
      - "scripts/validate_master_pipeline.py"
      - "scripts/run_master_mr_robustness.py"
      - "scripts/run_master_mr.py"
      - "scripts/run_master_susie.R"
      - "scripts/run_master_cross_ancestry.py"
      - "scripts/run_master_cross_platform.py"
      - "scripts/run_master_transcriptomics.py"
      - "scripts/run_master_phenotype_matrix.py"
      - "scripts/run_master_risk_factor.py"
      - "scripts/run_master_individual_validation.R"
      - "scripts/summarize_master_individual_validation.py"
      - "scripts/run_master_localization.py"
      - "tests/test_master_pipeline.py"
      - "tests/test_master_runner.py"
      - "tests/test_master_mr_robustness.py"
      - "tests/test_master_mr.py"
      - "tests/test_master_susie_contract.py"
      - "tests/test_master_cross_ancestry.py"
      - "tests/test_master_cross_platform.py"
      - "tests/test_master_transcriptomics.py"
      - "tests/test_master_phenotype_matrix.py"
      - "tests/test_master_risk_factor.py"
      - "tests/test_master_individual_validation_contract.py"
      - "tests/test_master_individual_summary.py"
      - "tests/test_master_localization.py"
      - "workflow/run_master.py"
      - ".github/workflows/master-pipeline-ci.yml"
  pull_request:
    paths:
      - "config/master_*.json"
      - "docs/MASTER_PIPELINE.md"
      - "scripts/validate_master_pipeline.py"
      - "tests/test_master_pipeline.py"
      - ".github/workflows/master-pipeline-ci.yml"
  workflow_dispatch:

jobs:
  validate-master-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate disease configs
        run: python scripts/validate_master_pipeline.py config/master_ckd.json config/master_is.json
      - name: Run MASTER tests
        run: python -m pytest -q tests/test_master_pipeline.py tests/test_master_runner.py tests/test_master_mr_robustness.py tests/test_master_mr.py tests/test_master_susie_contract.py tests/test_master_cross_ancestry.py tests/test_master_cross_platform.py tests/test_master_transcriptomics.py tests/test_master_phenotype_matrix.py tests/test_master_risk_factor.py tests/test_master_individual_validation_contract.py tests/test_master_individual_summary.py tests/test_master_localization.py
      - name: Dry-run CKD and IS stages 0-6
        run: |
          python workflow/run_master.py --disease ckd --stages 0-6 --dry-run
          python workflow/run_master.py --disease is --stages 0-6 --dry-run
