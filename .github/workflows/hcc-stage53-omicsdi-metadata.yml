name: HCC Stage53 OmicsDI OEP000321 and HCCDB25 Metadata Inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hcc/audit_stage53_omicsdi_metadata.py"
      - "tests/test_hcc_stage53_omicsdi_metadata.py"
      - ".github/workflows/hcc-stage53-omicsdi-metadata.yml"

permissions:
  contents: read

jobs:
  source-identity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact accessions, safe metadata, false-GO controls
        run: python -m unittest discover -s tests -p "test_hcc_stage53_omicsdi_metadata.py" -v

  official-index-queries:
    strategy:
      fail-fast: false
      matrix:
        accession: ["OEP000321", "HCCDB25"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read documented public OmicsDI dataset search and file metadata
        run: |
          python scripts/hcc/audit_stage53_omicsdi_metadata.py \
            --query "${{ matrix.accession }}" \
            --out "results/hcc/stage53/${{ matrix.accession }}_omicsdi_source_evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-stage53-${{ matrix.accession }}-metadata
          path: results/hcc/stage53/*.json
          if-no-files-found: warn
          retention-days: 30
