name: HCC Ng 2022 Public Quantitative RDS Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-ng-public-rds.yml'
      - 'scripts/hcc/audit_ng_public_multiomics_rds.R'
      - 'tests/test_hcc_ng_public_rds_contract.py'
      - 'scripts/hcc/probe_ng_suter_clinical_sample_join.py'
      - 'scripts/hcc/probe_ng_suter_covariate_balance.py'
      - 'tests/test_hcc_ng_suter_clinical_sample_join.py'
      - 'tests/test_hcc_ng_suter_covariate_balance.py'
      - 'scripts/hcc/assess_ng_rds_quantitative_qc.py'
      - 'tests/test_hcc_ng_rds_quantitative_qc.py'
      - 'scripts/hcc/audit_ng_suter_reduced_feature_mapping.R'
      - 'scripts/hcc/verify_ng_reduced_feature_mapping.py'
      - 'tests/test_hcc_ng_reduced_feature_mapping.py'
      - 'scripts/hcc/audit_ng_full_feature_namespace.R'
      - 'scripts/hcc/verify_ng_full_feature_namespace.py'
      - 'tests/test_hcc_ng_full_feature_namespace.py'

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check output privacy and semantic guardrails with synthetic data
        run: python -m unittest discover -s tests -p 'test_hcc_ng_public_rds_contract.py' -v
      - name: Test protected source-biopsy patient matching on synthetic keys
        run: python -m unittest discover -s tests -p 'test_hcc_ng_suter_clinical_sample_join.py' -v
      - name: Test source patient confounder QC with synthetic IDs
        run: python -m unittest discover -s tests -p 'test_hcc_ng_suter_covariate_balance.py' -v
      - name: Test RNA-protein QC numeric and feature provenance guards
        run: python -m unittest discover -s tests -p 'test_hcc_ng_rds_quantitative_qc.py' -v
      - name: Test gene crosswalk does not infer full-feature mapping
        run: python -m unittest discover -s tests -p 'test_hcc_ng_reduced_feature_mapping.py' -v
      - name: Test full-feature transcript/protein namespace source claims
        run: python -m unittest discover -s tests -p 'test_hcc_ng_full_feature_namespace.py' -v
      - name: Audit immutable public Ng/Suter multilayer RDS files (no private EGA access)
        env:
          NG_PRIVATE_KEYS_OUT: ${{ runner.temp }}/ng-suter-private-sample-labels.txt
        run: |
          Rscript scripts/hcc/audit_ng_public_multiomics_rds.R \
            results/hcc/feasibility/ng_public_multiomics_rds.json
      - name: Validate numeric multilayer structure and source provenance
        run: |
          python scripts/hcc/verify_ng_public_rds_evidence.py \
            --source results/hcc/feasibility/ng_public_multiomics_rds.json
      - name: Audit RNA/protein numeric scales, missingness and feature label intersection
        run: |
          python scripts/hcc/assess_ng_rds_quantitative_qc.py \
            --source results/hcc/feasibility/ng_public_multiomics_rds.json \
            --out results/hcc/feasibility/ng_rds_quantitative_qc.json
      - name: Audit original HCCinfo RDS reduced RNA/protein gene crosswalk
        run: |
          Rscript scripts/hcc/audit_ng_suter_reduced_feature_mapping.R \
            results/hcc/feasibility/ng_source_reduced_gene_crosswalk.json
      - name: Verify selected gene anchor counts with strict source provenance
        run: |
          python scripts/hcc/verify_ng_reduced_feature_mapping.py \
            --source results/hcc/feasibility/ng_source_reduced_gene_crosswalk.json
      - name: Audit complete 20356 transcript and 5585 protein feature IDs (source pinned)
        run: |
          Rscript scripts/hcc/audit_ng_full_feature_namespace.R \
            results/hcc/feasibility/ng_full_feature_namespace.json
      - name: Check original 5490-gene benchmark and strict full-mapping hold
        run: |
          python scripts/hcc/verify_ng_full_feature_namespace.py \
            --source results/hcc/feasibility/ng_full_feature_namespace.json
      - name: Source-check RDS sample aliases against official Ng 2022 biopsy and patient metadata
        run: |
          python scripts/hcc/probe_ng_suter_clinical_sample_join.py \
            --private-labels "${{ runner.temp }}/ng-suter-private-sample-labels.txt" \
            --out results/hcc/feasibility/ng_suter_biopsy_patient_join_qc.json
      - name: Audit 48-patient ALD-only vs HCV-only clinical covariates
        run: |
          python scripts/hcc/probe_ng_suter_covariate_balance.py \
            --private-labels "${{ runner.temp }}/ng-suter-private-sample-labels.txt" \
            --out results/hcc/feasibility/ng_suter_confounder_balance.json
      - name: Remove transient source biopsy IDs from runner
        if: always()
        run: rm -f "${{ runner.temp }}/ng-suter-private-sample-labels.txt"
      - name: Publish aggregate-only RDS research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-ng-public-quantitative-rds-evidence
          path: |
            results/hcc/feasibility/ng_public_multiomics_rds.json
            results/hcc/feasibility/ng_suter_biopsy_patient_join_qc.json
            results/hcc/feasibility/ng_suter_confounder_balance.json
            results/hcc/feasibility/ng_rds_quantitative_qc.json
            results/hcc/feasibility/ng_source_reduced_gene_crosswalk.json
            results/hcc/feasibility/ng_full_feature_namespace.json
          retention-days: 30
          if-no-files-found: warn
