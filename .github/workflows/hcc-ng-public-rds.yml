name: HCC Ng 2022 Public Quantitative RDS Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-ng-public-rds.yml'
      - 'scripts/hcc/audit_ng_public_multiomics_rds.R'
      - 'tests/test_hcc_ng_public_rds_contract.py'

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check output privacy and semantic guardrails with synthetic data
        run: python -m unittest discover -s tests -p 'test_hcc_ng_public_rds_contract.py' -v
      - name: Audit immutable public Ng/Suter multilayer RDS files (no private EGA access)
        run: |
          Rscript scripts/hcc/audit_ng_public_multiomics_rds.R \
            results/hcc/feasibility/ng_public_multiomics_rds.json
      - name: Validate numeric multilayer structure and source provenance
        run: |
          python scripts/hcc/verify_ng_public_rds_evidence.py \
            --source results/hcc/feasibility/ng_public_multiomics_rds.json
      - name: Publish aggregate-only RDS research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-ng-public-quantitative-rds-evidence
          path: results/hcc/feasibility/ng_public_multiomics_rds.json
          retention-days: 30
          if-no-files-found: warn
