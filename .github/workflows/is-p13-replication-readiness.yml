name: IS P1.3 GWAS Replication Readiness
on:
  push:
    branches: [main]
    paths: ['.github/research-queue/is-p13-request.json']
permissions:
  contents: read
concurrency:
  group: is-p13-readonly-replication
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: is-research-readonly
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact research job
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.github/research-queue/is-p13-request.json').read_text())
          assert x == {'schema_version':1,'job':'is-p13-readonly-replication','p1_source_run':39124908298,'non_live_only':True}
          print('P13_REQUEST_VALIDATED=PASS')
          PY
      - name: SSH setup
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then exit 1; fi
          done
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/server_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -yf "$HOME/.ssh/server_key" >/dev/null || exit 1
      - name: SSH read-only verification
        run: |
          OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i $HOME/.ssh/server_key"
          TMP=$(ssh $OPTS "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/is-p13.XXXXXXXX') || exit 1
          [[ "$TMP" == /tmp/is-p13.* ]] || exit 1
          echo "REMOTE_TMP=$TMP" >> "$GITHUB_ENV"
          scp $OPTS scripts/is/report_p13_replication_readiness.py "$SSH_USER@$SSH_HOST:$TMP/audit.py" || exit 1
          ssh $OPTS "$SSH_USER@$SSH_HOST" "python3 '$TMP/audit.py'"
      - name: Cleanup
        if: always()
        run: |
          if [[ "$REMOTE_TMP" == /tmp/is-p13.* ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -o ForwardAgent=no -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_TMP/audit.py'; rmdir '$REMOTE_TMP'" || true
          fi
