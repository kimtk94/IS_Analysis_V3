name: IS Harness Research Jobs CI

on:
  push:
    paths:
      - "scripts/is/harness_research_jobs.py"
      - "scripts/is/github_issue_queue_worker.py"
      - "tests/test_is_harness_research_jobs.py"
      - ".github/workflows/is-harness-research-jobs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research worker
        run: |
          python -m py_compile scripts/is/harness_research_jobs.py
          python -m py_compile scripts/is/github_issue_queue_worker.py
      - name: Run synthetic evidence regression tests
        run: python -m unittest discover -s tests -p 'test_is_harness_research_jobs.py' -v
