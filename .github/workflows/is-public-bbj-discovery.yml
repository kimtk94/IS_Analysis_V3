name: IS Public BBJ GWAS Source Discovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/is/discover_public_bbj_is_gwas.py"
      - ".github/workflows/is-public-bbj-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover direct BBJ ischemic stroke 2021 URL
        run: |
          python3 -m py_compile scripts/is/discover_public_bbj_is_gwas.py
          python3 scripts/is/discover_public_bbj_is_gwas.py --json-path evidence/BBJ_PUBLIC_LINK_DISCOVERY.json
      - name: Probe official BBJ ZIP response headers without downloading
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          data=json.loads(Path("evidence/BBJ_PUBLIC_LINK_DISCOVERY.json").read_text())
          if not data["matches"]:
              print("BBJ_ZIP_PROBE_SKIPPED: no official source link")
          else:
              u=data["matches"][0]["url"]
              try:
                  request=urllib.request.Request(u,method="HEAD",headers={"User-Agent":"IS-Research-GWAS-Provenance/1.0"})
                  with urllib.request.urlopen(request,timeout=45) as response:
                      print("BBJ_ZIP_HEAD_STATUS",response.status)
                      print("BBJ_ZIP_HEAD_TYPE",response.headers.get("Content-Type"))
                      print("BBJ_ZIP_HEAD_BYTES",response.headers.get("Content-Length"))
              except Exception as ex:
                  print("BBJ_ZIP_HEAD_UNAVAILABLE",type(ex).__name__,str(ex)[:180])
          PY
      - name: Upload small source-discovery record
        uses: actions/upload-artifact@v4
        with:
          name: is-public-bbj-download-discovery
          path: evidence/BBJ_PUBLIC_LINK_DISCOVERY.json
          if-no-files-found: error
          retention-days: 30
