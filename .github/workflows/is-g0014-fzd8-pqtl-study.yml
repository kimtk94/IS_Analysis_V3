name: IS G0014 FZD8 published pQTL study inventory
on:
  push:
    branches: [research/is-g0014-qtl-pilot-20261128]
    paths: ['.github/workflows/is-g0014-fzd8-pqtl-study.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public Open Targets study index, not restricted summary files
        run: |
          python3 - <<'PY'
          import json,hashlib,re,urllib.request,time
          from pathlib import Path
          url='https://api.platform.opentargets.org/api/v4/graphql'
          out={'status':'HOLD_PUBLIC_STUDY_INDEX_ONLY','scientific_validation':False,'target':'FZD8','uniprot':'Q9H461','ensembl':'ENSG00000177283','queries':{},'limits':['Public indexed study and credible-set context, not full pQTL summary statistics. No absence-of-association claim from search results. No restricted access or new causal inference.']}
          def save():Path('pqtl.json').write_text(json.dumps(out,indent=2,allow_nan=False)+'\n')
          def query(q,variables):
              body=json.dumps({'query':q,'variables':variables}).encode()
              req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'IS-public-pqtl-source-audit/1.0'})
              with urllib.request.urlopen(req,timeout=45) as res:
                  assert res.status==200
                  raw=res.read(4000001)
              assert len(raw)<=4000000
              x=json.loads(raw)
              if x.get('errors'):raise ValueError(str(x['errors'])[:500])
              return x['data'],hashlib.sha256(raw).hexdigest()
          search='query S($q:String!){search(queryString:$q,entityNames:["study"],page:{index:0,size:100}){total hits{id name entity}}}'
          for q in ('UKB_PPP_EUR_FZD8','UKB_PPP_EUR_FZD8_Q9H461','FZD8','Q9H461'):
              try:
                  d,sha=query(search,{'q':q})
                  hits=d['search']['hits'];total=d['search']['total']
                  assert isinstance(total,int) and total>=len(hits)
                  out['queries'][q]={'total':total,'returned':len(hits),'response_sha256':sha,'matching_study_hits':[h for h in hits if 'FZD8' in (h['id']+' '+(h.get('name') or '')).upper() or 'Q9H461' in (h['id']+' '+(h.get('name') or '')).upper()]}
              except Exception as e:out['queries'][q]={'error':type(e).__name__+': '+str(e)[:500]}
              save();time.sleep(2)
          ids=sorted({h['id'] for d in out['queries'].values() for h in d.get('matching_study_hits',[]) if re.fullmatch(r'UKB_PPP_[A-Z]+_FZD8_Q9H461_[A-Za-z0-9_]+',h['id'])})
          out['exact_study_ids']=ids
          out['study_details']={}
          for sid in ids[:10]:
              try:
                  d,sha=query('query S($id:String!){study(studyId:$id){studyId studyType traitFromSource nSamples}}',{'id':sid})
                  assert d['study']['studyId']==sid
                  out['study_details'][sid]={'data':d['study'],'response_sha256':sha}
              except Exception as e:out['study_details'][sid]={'error':type(e).__name__+': '+str(e)[:500]}
              save()
          out['status']='PUBLIC_STUDY_SEARCH_CONTEXT_ONLY' if any('total' in x for x in out['queries'].values()) else 'HOLD_API'
          save();print(json.dumps(out,indent=2))
          if out['status']=='HOLD_API':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is-g0014-fzd8-pqtl-study
          path: pqtl.json
          if-no-files-found: warn
          retention-days: 90
