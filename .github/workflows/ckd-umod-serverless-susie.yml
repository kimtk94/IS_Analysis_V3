name: CKD UMOD Serverless SuSiE
on:
  workflow_dispatch:
  push:
    branches: [research/thesis-evidence-freeze-20261015]
    paths:
      - '.github/workflows/ckd-umod-serverless-susie.yml'
      - 'scripts/ckd_umod_serverless_susie.R'
permissions:
  contents: read
jobs:
  input-audit:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Validate real UMOD input availability
        run: |
          python3 scripts/ckd_umod_serverless_gate.py
          if test -s input/ckd/umod/UMOD.ld.bin && test -s input/ckd/umod/UMOD.tsv.gz && test -s input/ckd/umod/UMOD.ld.meta.tsv && test -s input/ckd/umod/UMOD.ld.vars; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Research analysis blocked: missing primary UMOD input bundle"
          fi
  susie:
    needs: input-audit
    if: needs.input-audit.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::susieR
      - name: Revalidate primary files and run exploratory LD shrinkage
        run: |
          python3 scripts/ckd_umod_serverless_gate.py
          Rscript scripts/ckd_umod_serverless_susie.R | tee umod_shrinkage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umod-serverless-diagnostic-log
          path: umod_shrinkage.log
          if-no-files-found: ignore
