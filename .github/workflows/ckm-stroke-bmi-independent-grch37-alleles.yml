name: CKM BMI independent Ensembl GRCh37 44 sentinel allele reference

on:
  push:
    paths:
      - '.github/workflows/ckm-stroke-bmi-independent-grch37-alleles.yml'
      - 'scripts/ckm_stroke/audit_bmi_grch37_reference_sentinels.py'
      - 'tests/test_ckm_stroke_bmi_grch37_reference_sentinels.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ckm-bmi-grch37-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate deterministic sampling, Ensembl GRCh37 response, and scientific HOLD
        run: |
          python -m py_compile scripts/ckm_stroke/audit_bmi_grch37_reference_sentinels.py
          python -m unittest discover -s tests -p 'test_ckm_stroke_bmi_grch37_reference_sentinels.py' -v

  independent-reference:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bmi-ensembl44-full]')
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned conservative GIANT BMI candidate in ignored folder
        run: |
          python -m scripts.ckm_stroke.prepare_bmi_ldsc_candidate \
            --out artifacts/ckm_stroke/bmi_candidate_independent_reference_ci.json \
            --emit-candidate artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz
      - name: 22-chromosome stratified 44-SNP Ensembl GRCh37 forward-reference audit
        run: |
          python -m scripts.ckm_stroke.audit_bmi_grch37_reference_sentinels \
            --candidate artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz \
            --provenance artifacts/ckm_stroke/bmi_candidate_independent_reference_ci.json \
            --out artifacts/ckm_stroke/bmi_ensembl_grch37_sentinels_ci.json
      - name: Delete candidate before uploading evidence
        if: always()
        run: |
          python -c "from pathlib import Path; Path('artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz').unlink(missing_ok=True)"
          python -c "from pathlib import Path; Path('artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz.partial').unlink(missing_ok=True)"
      - name: Upload aggregate and bounded public 44-marker evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-independent-grch37-44-sentinel-evidence
          path: |
            artifacts/ckm_stroke/bmi_candidate_independent_reference_ci.json
            artifacts/ckm_stroke/bmi_ensembl_grch37_sentinels_ci.json
          if-no-files-found: warn
          retention-days: 30
