name: Ocular Gate B BeamA Selection and Original Author DEG Provenance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confidence-and-published-table-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public metadata parser without downloading expression matrices
        run: |
          python -m pip install 'numpy==1.26.4'
          python -m py_compile scripts/ocular/ocular_gate_b_metadata_author_audit.py
      - name: Recompute donor eligibility at score 0.50 and 0.75 and verify author gene-list provenance
        run: |
          mkdir -p ocular-gate-b-public
          python -u scripts/ocular/ocular_gate_b_metadata_author_audit.py --out ocular-gate-b-public
      - name: Upload aggregate QC only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocular-gate-b-metadata-and-author
          path: ocular-gate-b-public/
          retention-days: 30
          if-no-files-found: warn
