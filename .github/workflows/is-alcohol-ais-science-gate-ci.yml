permissions:
  contents: read

jobs:
  provenance-unit-tests:
    name: Offline, fail-closed association audit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (stdlib only)
        run: |
          python3 -m py_compile \
            scripts/is/audit_alcohol_cs_ais_direct_overlap.py \
            scripts/is/audit_gigastroke_ais_refalt_provenance.py \
            scripts/is/gigastroke_fasta_variant_contract.py \
            scripts/is/build_alcohol_ais_verified_variant_matrix.py \
            scripts/is/audit_alcohol_ais_eur_transfer.py \
            scripts/is/audit_aldh2_conditional_ld_gate.py \
            scripts/is/build_tpmi_grch38_mapping.py \
            scripts/is/audit_tpmi_grch38_chain_ucsc.py \
            scripts/is/audit_tpmi_43321_summary_gwas.py \
            scripts/is/build_existing_is_gene_evidence_matrix.py \
            scripts/is/audit_local_drive_coloc_abf_recovery.py \
            scripts/is/summarize_646_coloc_replay_science_readiness.py \
            scripts/is/audit_646_coloc_allele_frequency_provenance.py \
            scripts/is/build_is_2225_prior_af_integrated_context.py \
            scripts/is/audit_all_8956_bbj_native_allele_chain.py \
            scripts/is/audit_saved_gtex_qtd_alt_major_overlap.py \
            scripts/is/audit_gtex_alt_major_10_snp_native_bbj.py \
            scripts/is/build_is_nine_gene_mechanism_readiness.py \
            scripts/is/audit_is_altmajor_maf_gate_lineage.py \
            scripts/is/audit_is_30_eas_regions_six_gwas_sources.py \
            scripts/is/pilot_is_eas_two_region_public_nominal_qtl.py \
            scripts/is/pilot_is_eas_t1_three_region_public_nominal_qtl.py \
            scripts/is/build_is_eas30_gwas_qtl_expansion_queue.py \
            scripts/is/audit_is_eas30_crossgwas_source_leads.py \
            scripts/is/merge_is_eas30_public_nominal_qtl_15_sources.py \
            scripts/is/audit_is_eas5_public_qtl_gwas_snp_overlap.py \
            scripts/is/audit_is_eas5_official_alt_effect_and_dedup.py \
            scripts/is/audit_is_eas5_same_variant_qtl_ais_p.py \
            scripts/is/audit_is_8956_maf_palindrome_reference.py \
            scripts/is/summarize_is_646_prior_h3h4_2225_genes.py \
            scripts/is/build_is_eas30_qtl_gap_priority.py

      - name: Run isolated SNP harmonization and science-gate tests
        run: |
          set -euo pipefail
          for test_file in \
            test_alcohol_cs_ais_direct_overlap.py \
            test_gigastroke_ais_refalt_provenance.py \
            test_gigastroke_fasta_variant_contract.py \
            test_alcohol_ais_verified_variant_matrix.py \
            test_alcohol_ais_eur_transfer.py \
            test_aldh2_conditional_ld_gate.py \
            test_tpmi_grch38_mapping.py \
            test_tpmi_grch38_chain_ucsc.py \
            test_tpmi_43321_summary_gwas.py \
            test_existing_is_gene_evidence_matrix.py \
            test_local_drive_coloc_abf_recovery.py \
            test_646_coloc_replay_science_readiness.py \
            test_646_coloc_allele_frequency_provenance.py \
            test_is_2225_prior_af_integrated_context.py \
            test_all_8956_bbj_native_allele_chain.py \
            test_saved_gtex_qtd_alt_major_overlap.py \
            test_gtex_alt_major_native_bbj.py \
            test_is_nine_gene_mechanism_readiness.py \
            test_is_altmajor_maf_gate_lineage.py \
            test_is_30_eas_regions_six_gwas_sources.py \
            test_is_eas_two_region_qtl_nominal_pilot.py \
            test_is_eas30_gwas_qtl_expansion_queue.py \
            test_is_eas30_crossgwas_source_leads.py \
            test_is_eas30_public_nominal_qtl_15_sources.py \
            test_is_eas5_public_qtl_gwas_snp_overlap.py \
            test_is_eas5_official_alt_effect_and_dedup.py \
            test_is_eas5_same_variant_qtl_ais_p.py \
            test_is_8956_maf_palindrome_reference.py \
            test_is_646_prior_h3h4_2225_genes.py \
            test_is_eas30_qtl_gap_priority.py
          do
            echo "RUNNING $test_file"
            python3 -m unittest discover \
              -s tests -p "$test_file" -v
          done

      - name: Confirm no scientific promotion in source audit documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("scripts/is")
          text=(root/"audit_aldh2_conditional_ld_gate.py").read_text()
          assert 'ALDH2_BLOCKED_lifted' in text
          assert 'ALDH2_BLOCKED_lifted":False' in text.replace(" ", "")
          print("ALDH2_BLOCKED_SCIENCE_GATE_CONTRACT_OK")
          PY
