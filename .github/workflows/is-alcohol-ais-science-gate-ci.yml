name: IS Alcohol–AIS Allele & Science Gate CI

on:
  push:
    branches:
      - main
      - research/is-broad-discovery-20261009
    paths:
      - "scripts/is/audit_alcohol_cs_ais_direct_overlap.py"
      - "scripts/is/audit_gigastroke_ais_refalt_provenance.py"
      - "scripts/is/gigastroke_fasta_variant_contract.py"
      - "scripts/is/build_alcohol_ais_verified_variant_matrix.py"
      - "scripts/is/audit_alcohol_ais_eur_transfer.py"
      - "scripts/is/audit_aldh2_conditional_ld_gate.py"
      - "scripts/is/build_tpmi_grch38_mapping.py"
      - "scripts/is/audit_tpmi_grch38_chain_ucsc.py"
      - "scripts/is/audit_tpmi_43321_summary_gwas.py"
      - "scripts/is/build_existing_is_gene_evidence_matrix.py"
      - "scripts/is/audit_local_drive_coloc_abf_recovery.py"
      - "scripts/is/replay_existing_646_coloc_abf.R"
      - "scripts/is/run_existing_646_coloc_qtl_n_sensitivity.R"
      - "scripts/is/summarize_646_coloc_replay_science_readiness.py"
      - "scripts/is/audit_646_coloc_allele_frequency_provenance.py"
      - "scripts/is/run_646_coloc_direct_p12_sensitivity.R"
      - "scripts/is/build_is_2225_prior_af_integrated_context.py"
      - "scripts/is/render_is_646_coloc_evidence_figures.R"
      - "tests/test_alcohol_cs_ais_direct_overlap.py"
      - "tests/test_gigastroke_ais_refalt_provenance.py"
      - "tests/test_gigastroke_fasta_variant_contract.py"
      - "tests/test_alcohol_ais_verified_variant_matrix.py"
      - "tests/test_alcohol_ais_eur_transfer.py"
      - "tests/test_aldh2_conditional_ld_gate.py"
      - "tests/test_tpmi_grch38_mapping.py"
      - "tests/test_tpmi_grch38_chain_ucsc.py"
      - "tests/test_tpmi_43321_summary_gwas.py"
      - "tests/test_existing_is_gene_evidence_matrix.py"
      - "tests/test_local_drive_coloc_abf_recovery.py"
      - "tests/test_646_coloc_replay_science_readiness.py"
      - "tests/test_646_coloc_allele_frequency_provenance.py"
      - "tests/test_is_2225_prior_af_integrated_context.py"
      - ".github/workflows/is-alcohol-ais-science-gate-ci.yml"
  pull_request:
    paths:
      - "scripts/is/**"
      - "tests/test_alcohol*"
      - "tests/test_gigastroke*"
      - "tests/test_646_coloc*"
      - ".github/workflows/is-alcohol-ais-science-gate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-unit-tests:
    name: Offline, fail-closed association audit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (stdlib only)
        run: |
          python3 -m py_compile \
            scripts/is/audit_alcohol_cs_ais_direct_overlap.py \
            scripts/is/audit_gigastroke_ais_refalt_provenance.py \
            scripts/is/gigastroke_fasta_variant_contract.py \
            scripts/is/build_alcohol_ais_verified_variant_matrix.py \
            scripts/is/audit_alcohol_ais_eur_transfer.py \
            scripts/is/audit_aldh2_conditional_ld_gate.py \
            scripts/is/build_tpmi_grch38_mapping.py \
            scripts/is/audit_tpmi_grch38_chain_ucsc.py \
            scripts/is/audit_tpmi_43321_summary_gwas.py \
            scripts/is/build_existing_is_gene_evidence_matrix.py \
            scripts/is/audit_local_drive_coloc_abf_recovery.py \
            scripts/is/summarize_646_coloc_replay_science_readiness.py \
            scripts/is/audit_646_coloc_allele_frequency_provenance.py \
            scripts/is/build_is_2225_prior_af_integrated_context.py

      - name: Run isolated SNP harmonization and science-gate tests
        run: |
          set -euo pipefail
          for test_file in \
            test_alcohol_cs_ais_direct_overlap.py \
            test_gigastroke_ais_refalt_provenance.py \
            test_gigastroke_fasta_variant_contract.py \
            test_alcohol_ais_verified_variant_matrix.py \
            test_alcohol_ais_eur_transfer.py \
            test_aldh2_conditional_ld_gate.py \
            test_tpmi_grch38_mapping.py \
            test_tpmi_grch38_chain_ucsc.py \
            test_tpmi_43321_summary_gwas.py \
            test_existing_is_gene_evidence_matrix.py \
            test_local_drive_coloc_abf_recovery.py \
            test_646_coloc_replay_science_readiness.py \
            test_646_coloc_allele_frequency_provenance.py \
            test_is_2225_prior_af_integrated_context.py
          do
            echo "RUNNING $test_file"
            python3 -m unittest discover \
              -s tests -p "$test_file" -v
          done

      - name: Confirm no scientific promotion in source audit documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("scripts/is")
          text=(root/"audit_aldh2_conditional_ld_gate.py").read_text()
          assert 'ALDH2_BLOCKED_lifted' in text
          assert 'ALDH2_BLOCKED_lifted":False' in text.replace(" ", "")
          print("ALDH2_BLOCKED_SCIENCE_GATE_CONTRACT_OK")
          PY
