name: IS P3A all-candidate original GWAS MD5 and eQTL scientific gate

on:
  push:
    paths:
      - '.github/workflows/is-p3a-all-source-md5-review.yml'
      - 'scripts/is/p3a_publisher_md5_gate.py'
      - 'scripts/is/p3a_join_original_source_evidence.py'
      - 'tests/test_is_p3a_source_joined_md5.py'
      - 'docs/is/evidence/IS_P3A_ARCHIVED_FULL_GROUP_AUDIT.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: is-p3a-primary-source-all-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject invented source N, mismatched release and group IDs
        run: |
          python -m py_compile scripts/is/p3a_publisher_md5_gate.py scripts/is/p3a_join_original_source_evidence.py
          python -m unittest discover -s tests -p 'test_is_p3a_source_joined_md5.py' -v

  publisher-whole-file:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        ancestry: [EUR, EAS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stream original publisher bytes and independently match live MD5, pinned SHA256, length
        run: |
          python -m scripts.is.p3a_publisher_md5_gate --ancestry ${{ matrix.ancestry }} --out artifacts/md5/${{ matrix.ancestry }}/publisher_original_integrity.json
      - name: Preserve minimal evidence, not whole GWAS compressed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-p3a-source-whole-file-${{ matrix.ancestry }}-md5-evidence
          path: artifacts/md5/${{ matrix.ancestry }}/publisher_original_integrity.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-and-review:
    needs: publisher-whole-file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get both current official source verification reports
        uses: actions/download-artifact@v4
        with:
          pattern: is-p3a-source-whole-file-*-md5-evidence
          path: inputs/current
      - name: Pinned original full EUR GWAS structure and cohort QC
        uses: actions/download-artifact@v4
        with:
          name: is-gwas-full-original-qc-EUR
          run-id: 43858821798
          github-token: ${{ github.token }}
          path: inputs/previous/EUR
      - name: Pinned original full EAS GWAS structure and cohort QC
        uses: actions/download-artifact@v4
        with:
          name: is-gwas-full-original-qc-EAS
          run-id: 43858821798
          github-token: ${{ github.token }}
          path: inputs/previous/EAS
      - name: Pinned genuine Japanese cis-eQTL source audit
        uses: actions/download-artifact@v4
        with:
          name: is-EGEAD420-original-eQTL-coloc-GO-HOLD
          run-id: 43858822068
          github-token: ${{ github.token }}
          path: inputs/previous/EGEAD420
      - name: Pinned original BBJ cohort source supplement (not independent replication)
        uses: actions/download-artifact@v4
        with:
          name: is-ci-public-gwas-provenance
          run-id: 44900451784
          github-token: ${{ github.token }}
          path: inputs/previous/BBJ
      - name: Join real-source reports with candidate-wide 36-group blocking matrix
        run: |
          if [ -f docs/is/evidence/IS_P3A_ARCHIVED_FULL_GROUP_AUDIT.json ]; then
            python -m scripts.is.p3a_join_original_source_evidence --baseline docs/is/evidence/IS_CANDIDATE_WIDE_COLOC_BASELINE_20261122.json --eur-now inputs/current/is-p3a-source-whole-file-EUR-md5-evidence/publisher_original_integrity.json --eas-now inputs/current/is-p3a-source-whole-file-EAS-md5-evidence/publisher_original_integrity.json --eur-prior inputs/previous/EUR/source_full_qc.json --eas-prior inputs/previous/EAS/source_full_qc.json --eqtl inputs/previous/EGEAD420/EGEAD420_reproducible_go_hold.json --supplement inputs/previous/BBJ/ci_public_gwas_evidence.json --original-groups docs/is/evidence/IS_P3A_ARCHIVED_FULL_GROUP_AUDIT.json --out artifacts/is/p3a_all_source_scientific_HOLD.json
          else
            python -m scripts.is.p3a_join_original_source_evidence --baseline docs/is/evidence/IS_CANDIDATE_WIDE_COLOC_BASELINE_20261122.json --eur-now inputs/current/is-p3a-source-whole-file-EUR-md5-evidence/publisher_original_integrity.json --eas-now inputs/current/is-p3a-source-whole-file-EAS-md5-evidence/publisher_original_integrity.json --eur-prior inputs/previous/EUR/source_full_qc.json --eas-prior inputs/previous/EAS/source_full_qc.json --eqtl inputs/previous/EGEAD420/EGEAD420_reproducible_go_hold.json --supplement inputs/previous/BBJ/ci_public_gwas_evidence.json --out artifacts/is/p3a_all_source_scientific_HOLD.json
          fi
      - name: Upload source evidence combined scientific HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-p3a-joined-all-candidate-source-scientific-HOLD
          path: artifacts/is/p3a_all_source_scientific_HOLD.json
          if-no-files-found: warn
          retention-days: 30
