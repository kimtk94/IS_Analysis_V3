name: CKM stroke professor proposal scientific evidence gate
on:
  push:
    paths:
      - '.github/workflows/ckm-stroke-professor-proposal-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-proposal-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ckm-stroke-staged-actions-20261111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prevent missing study sources, swapped LAA-CE outcomes and scientifically overclaimed results
        run: |
          python -m unittest discover -s tests -p 'test_ckm_stroke_professor_proposal_evidence.py' -v
