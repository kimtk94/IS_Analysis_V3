name: Muscle acute signature native R and validation
on:
  push:
    branches: [research/muscle-fixed-acute-signature-20261125]
    paths: ['scripts/muscle_motrpac_signature.R','scripts/muscle_motrpac_download.py','scripts/muscle_fixed_signature_validation.py','.github/workflows/muscle-fixed-signature.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Retrieve and verify exact public objects
        run: |
          python3 scripts/muscle_motrpac_download.py --root "$RUNNER_TEMP/source" --out outputs/inputs.json
      - name: Freeze source signature using native R
        run: |
          Rscript scripts/muscle_motrpac_signature.R "$RUNNER_TEMP/source" outputs
          cat outputs/source.tsv
          sha256sum outputs/panel.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-frozen-motrpac-panel
          path: outputs/
          if-no-files-found: error
          retention-days: 90
  validate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, chronic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: muscle-frozen-motrpac-panel
          path: frozen
      - run: python scripts/muscle_fixed_signature_validation.py selftest
      - run: python scripts/muscle_fixed_signature_validation.py ${{ matrix.mode }} --root "$RUNNER_TEMP/input" --panel frozen/panel.tsv --out outputs/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-fixed-signature-${{ matrix.mode }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90
