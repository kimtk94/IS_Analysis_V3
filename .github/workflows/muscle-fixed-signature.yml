name: Muscle acute signature source and validation
on:
  push:
    branches: [research/muscle-fixed-acute-signature-20261125]
    paths: ['scripts/muscle_motrpac_signature.py','scripts/muscle_fixed_signature_validation.py','.github/workflows/muscle-fixed-signature.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  muscle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 pyreadr==0.5.3 scipy==1.15.3
      - run: |
          python -m py_compile scripts/muscle_motrpac_signature.py scripts/muscle_fixed_signature_validation.py
          python scripts/muscle_fixed_signature_validation.py selftest
      - name: Freeze aggregate source before reading validation
        run: |
          python scripts/muscle_motrpac_signature.py --root "$RUNNER_TEMP/source" --out outputs/frozen
          sha256sum outputs/frozen/panel.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-frozen-motrpac-panel
          path: outputs/frozen/
          if-no-files-found: error
          retention-days: 90
      - name: Baseline ordinal association
        run: |
          python scripts/muscle_fixed_signature_validation.py baseline --root "$RUNNER_TEMP/baseline" --panel outputs/frozen/panel.tsv --out outputs/baseline.json
      - name: Chronic molecular volume contrast
        run: |
          python scripts/muscle_fixed_signature_validation.py chronic --root "$RUNNER_TEMP/chronic" --panel outputs/frozen/panel.tsv --out outputs/chronic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muscle-fixed-signature-result
          path: outputs/
          if-no-files-found: ignore
          retention-days: 90
