name: Muscle frozen acute signature portability
on:
  push:
    branches: [research/muscle-fixed-acute-signature-20261125]
    paths: ['scripts/muscle_motrpac_signature.py','scripts/muscle_fixed_signature_validation.py','.github/workflows/muscle-fixed-signature.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 pyreadr==0.5.3
      - run: python scripts/muscle_motrpac_signature.py --root "$RUNNER_TEMP/source" --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-frozen-motrpac-panel
          path: outputs/
          if-no-files-found: error
          retention-days: 90
  validate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, chronic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: muscle-frozen-motrpac-panel
          path: frozen
      - run: python scripts/muscle_fixed_signature_validation.py selftest
      - run: python scripts/muscle_fixed_signature_validation.py ${{ matrix.mode }} --root "$RUNNER_TEMP/input" --panel frozen/panel.tsv --out outputs/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-fixed-signature-${{ matrix.mode }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90
