name: CKD GIPC2 locus evidence audit
on:
  push:
    branches: [research/ckd-filtration-tissue-20261124]
    paths: ['scripts/ckd_gipc2_locus_audit.py','.github/workflows/ckd-gipc2-locus-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-locus:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve exact previous public derived screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in egfr:14922713044 bun:14923201035; do
            trait=${pair%:*}
            id=${pair#*:}
            curl -fLsS --connect-timeout 15 --max-time 45 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$trait.zip"
          done
      - run: python3 scripts/ckd_gipc2_locus_audit.py --root "$RUNNER_TEMP" --out outputs/gipc2.json
      - uses: actions/upload-artifact@v4
        with:
          name: ckd-gipc2-locus-evidence
          path: outputs/
          if-no-files-found: error
          retention-days: 90
