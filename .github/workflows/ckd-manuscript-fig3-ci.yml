name: CKD Figure 3 reproducibility
on:
  push:
    branches: [research/thesis-evidence-freeze-20261015]
    paths:
      - 'scripts/plot_ckd_manuscript_fig3.py'
      - 'tests/test_ckd_manuscript_fig3.py'
      - '.github/workflows/ckd-manuscript-fig3-ci.yml'
  pull_request:
    paths:
      - 'scripts/plot_ckd_manuscript_fig3.py'
      - 'tests/test_ckd_manuscript_fig3.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  figure-synthetic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.9.2
      - name: Compile
        run: python -m py_compile scripts/plot_ckd_manuscript_fig3.py
      - name: Generate synthetic figure and verify evidence guards
        run: python -m unittest discover -s tests -p 'test_ckd_manuscript_fig3.py' -v
