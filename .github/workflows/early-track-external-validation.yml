name: Early HCC historical gene-model sensitivity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publication/hcc_historical_gene_model.py'
      - '.github/workflows/early-track-external-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-tumor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9703492179f0a29ecb7a332a24d474c49a7c10f7
          path: prior
      - uses: actions/checkout@v4
        with:
          ref: c77c12dc7f9ed67e153ae3ea08046772d5c23113
          path: orthogonal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 openpyxl==3.1.5
      - run: python scripts/publication/hcc_historical_gene_model.py selftest
      - run: python -u scripts/publication/hcc_historical_gene_model.py analyze --out evidence/hcc_tumor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-historical-model
          path: evidence/hcc_tumor.json
          if-no-files-found: error
          retention-days: 30
