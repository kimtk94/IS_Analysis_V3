name: CKM Locke 2015 GIANT EUR pre-UKB BMI alternate source audit

on:
  push:
    paths:
      - '.github/workflows/ckm-stroke-locke-2015-bmi-source-audit.yml'
      - 'scripts/ckm_stroke/audit_locke_2015_bmi_overlap.py'
      - 'tests/test_ckm_stroke_locke_2015_bmi_overlap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ckm-locke-2015-ukb-sensitivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test original source/N/frequency and duplicate-rsID quarantine
        run: |
          python -m py_compile scripts/ckm_stroke/audit_locke_2015_bmi_overlap.py
          python -m unittest discover -s tests -p 'test_ckm_stroke_locke_2015_bmi_overlap.py' -v

  original-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[locke-2015-full]')
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recreate pinned 2018 comparison BMI candidate temporarily
        run: |
          python -m scripts.ckm_stroke.prepare_bmi_ldsc_candidate \
            --out artifacts/ckm_stroke/bmi_candidate_for_locke_ci.json \
            --emit-candidate artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz
      - name: Stream official 2015 Locke GIANT EUR source and compare all rsIDs/allele orientations
        run: |
          python -m scripts.ckm_stroke.audit_locke_2015_bmi_overlap \
            --candidate artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz \
            --provenance artifacts/ckm_stroke/bmi_candidate_for_locke_ci.json \
            --out artifacts/ckm_stroke/locke_2015_full_source_qc_ci.json
      - name: Remove temporary derived candidate before any upload
        if: always()
        run: |
          python -c "from pathlib import Path; Path('artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz').unlink(missing_ok=True)"
          python -c "from pathlib import Path; Path('artifacts/ckm_stroke/bmi_3way_conservative.sumstats.gz.partial').unlink(missing_ok=True)"
      - name: Publish JSON-only provenance, no original association data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-locke-2015-preUKB-bmi-source-QC
          path: |
            artifacts/ckm_stroke/bmi_candidate_for_locke_ci.json
            artifacts/ckm_stroke/locke_2015_full_source_qc_ci.json
          if-no-files-found: warn
          retention-days: 30
