name: CKD IgAN biopsy focused replay
on:
  push:
    branches: [research/ckd-filtration-tissue-20261124]
    paths: ['.github/workflows/ckd-biopsy-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  biopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: scipy==1.15.3
      - name: Download processed matrix and compact platform-only annotation
        run: |
          set -eu
          curl -fLsS --connect-timeout 15 --max-time 90 --max-filesize 80000000 "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE116nnn/GSE116626/matrix/GSE116626_series_matrix.txt.gz" -o "$RUNNER_TEMP/matrix.gz"
          curl -fLsS --connect-timeout 15 --max-time 90 --max-filesize 80000000 "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GPL14951&targ=self&form=text&view=full" -o "$RUNNER_TEMP/platform.txt"
      - run: python scripts/ckd_filtration_tissue.py biopsy --root "$RUNNER_TEMP" --out outputs/biopsy.json
      - uses: actions/upload-artifact@v4
        with:
          name: ckd-igan-biopsy-fixed-genes
          path: outputs/
          if-no-files-found: error
          retention-days: 90
