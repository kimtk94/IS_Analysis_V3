name: HCC Parallel P0 Evidence Audit (Manual Backup)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcc-p0-manual-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: P0 / ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        track:
          - ng-public
          - pdc-mapping
          - rna-access
          - geo-clinical
          - xing-clinical
          - regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent P0 checks (all task results preserved)
        shell: bash --noprofile --norc {0}
        run: |
          python scripts/hcc/run_parallel_p0_track.py \
            --track '${{ matrix.track }}' \
            --out-dir 'results/hcc/parallel/${{ matrix.track }}'
      - name: Upload sanitized lane audit and task-status manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-p0-${{ matrix.track }}
          path: results/hcc/parallel/${{ matrix.track }}/
          retention-days: 14
          if-no-files-found: error

  consolidate:
    name: P0 / aggregate six independent lanes
    if: always()
    needs: [audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve per-lane sanitized evidence artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hcc-p0-*
          merge-multiple: false
          path: artifacts
      - name: Render one fail-closed P0 report
        shell: bash --noprofile --norc {0}
        run: |
          python scripts/hcc/summarize_parallel_p0.py \
            --root artifacts \
            --out results/hcc/parallel/summary.json
      - name: Upload combined research execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-p0-summary
          path: results/hcc/parallel/summary.json
          retention-days: 14
          if-no-files-found: warn
