name: IS published COL4A2 A C pair recovery
on:
  push:
    branches: [research/is-fixed-subtype-indexed-20261125]
    paths: ['scripts/is/fixed_subtype_col4a2_pair.py','.github/workflows/is-fixed-subtype-col4a2-pair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'PyYAML==6.0.2'
          python -m py_compile scripts/is/fixed_subtype_col4a2_pair.py
          python scripts/is/fixed_subtype_col4a2_pair.py reference --out outputs/reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: col4a2-published-pair-reference
          path: outputs/reference.json
          if-no-files-found: error
          retention-days: 90
  extract:
    needs: reference
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        study: [EUR_SVS, EAS_SVS, EUR_CES, EAS_CES, EUR_LAS, EAS_LAS, EUR_AIS, EAS_AIS]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: col4a2-published-pair-reference
          path: inputs/
      - run: |
          python -m pip install 'PyYAML==6.0.2'
          python scripts/is/fixed_subtype_col4a2_pair.py extract --study "${{ matrix.study }}" --ref inputs/reference.json --out "outputs/${{ matrix.study }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: col4a2-published-pair-${{ matrix.study }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90
