name: HCC Stage56 Browser-Observed HCCDB25 Route JS Chunk Evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hcc/audit_stage56_hccdb_browser_chunks.mjs"
      - "tests/test_hcc_stage56_hccdb_browser_chunks.mjs"
      - ".github/workflows/hcc-stage56-hccdb-browser-chunks.yml"

permissions:
  contents: read

jobs:
  offline-network-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject speculative assets, backend calls and biological GO
        run: node --test tests/test_hcc_stage56_hccdb_browser_chunks.mjs

  browser-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install public Chromium browser
        run: npx playwright install chromium
      - name: Observe only official SPA static JavaScript loaded by public routes
        run: |
          node scripts/hcc/audit_stage56_hccdb_browser_chunks.mjs \
            --out results/hcc/stage56/hccdb25_browser_route_public_chunks.json
      - name: Preserve anonymous source hashes and public static asset paths
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-stage56-source-observed-route-chunks
          path: results/hcc/stage56/*.json
          retention-days: 30
          if-no-files-found: warn
