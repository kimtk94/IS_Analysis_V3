name: Ocular ex vivo frozen paired score
on:
  push:
    branches: [research/ocular-exvivo-fixed-panel-20261125]
    paths: ['scripts/ocular_exvivo_paired_score.py','.github/workflows/ocular-exvivo-paired-score.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-score:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6941039ae9d9de79793048d433536f7c7437d744
          path: frozen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 32bdfc54c2b6418cee6acd65e6d39fac878864ca
          path: prior
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused pairing and score tests
        run: |
          export PYTHONPATH="$PWD/frozen/scripts:$PWD/prior/scripts"
          python -m py_compile scripts/ocular_exvivo_paired_score.py
          python scripts/ocular_exvivo_paired_score.py --selftest
      - name: Retrieve the three pinned public inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fLsS --connect-timeout 15 --max-time 60 --max-filesize 4000000 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14912728421/zip" -o "$RUNNER_TEMP/panel.zip"
          curl -fLsS --connect-timeout 15 --max-time 80 --max-filesize 20000000 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE37nnn/GSE37474/matrix/GSE37474_series_matrix.txt.gz' -o "$RUNNER_TEMP/matrix.gz"
          curl -fLsS --connect-timeout 15 --max-time 80 --max-filesize 20000000 'https://ftp.ncbi.nlm.nih.gov/geo/platforms/GPLnnn/GPL570/annot/GPL570.annot.gz' -o "$RUNNER_TEMP/annot.gz"
      - name: Verify donor pairing and score both fixed panels
        run: |
          export PYTHONPATH="$PWD/frozen/scripts:$PWD/prior/scripts"
          python scripts/ocular_exvivo_paired_score.py --root "$RUNNER_TEMP" --out outputs/exvivo-paired-score.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocular-exvivo-paired-score
          path: outputs/
          if-no-files-found: error
          retention-days: 90
