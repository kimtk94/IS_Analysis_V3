name: IS BBJ 2021 EAS5 Historical Evidence Freeze (CI only)

on:
  push:
    branches: [feat/is-bbj-2021-source-evidence-freeze-20261102]
    paths:
      - "research/is/evidence/bbj2021_eas5_source_comparison_log_20261018.json"
      - "scripts/is/audit_bbj_2021_source_freeze.py"
      - "tests/test_is_bbj_2021_source_freeze.py"
      - ".github/workflows/is-bbj-source-evidence-freeze.yml"
  pull_request:
    paths:
      - "research/is/evidence/bbj2021_eas5_source_comparison_log_20261018.json"
      - "scripts/is/audit_bbj_2021_source_freeze.py"
      - "tests/test_is_bbj_2021_source_freeze.py"
      - ".github/workflows/is-bbj-source-evidence-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify code and negative-control tests
        run: python3 -m unittest discover -s tests -p 'test_is_bbj_2021_source_freeze.py' -v
      - name: Reaudit pinned historical log evidence (no external source recomputation)
        run: python3 scripts/is/audit_bbj_2021_source_freeze.py --input research/is/evidence/bbj2021_eas5_source_comparison_log_20261018.json --output ci_reports/is_bbj2021_eas5_source_freeze.json
      - name: Upload fail-closed source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-bbj2021-historical-source-evidence
          path: ci_reports/is_bbj2021_eas5_source_freeze.json
          if-no-files-found: ignore
          retention-days: 30
