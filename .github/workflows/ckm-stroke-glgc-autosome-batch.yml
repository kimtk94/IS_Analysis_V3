name: CKM Stroke P1 GLGC bounded autosome batch (manual, gated)

on:
  workflow_dispatch:
    inputs:
      chr22_run_id:
        description: 'Completed chr22 technical PASS run ID with aggregate artifact'
        type: string
        required: true
      chromosomes:
        description: 'One to three distinct chromosomes 1-21 (e.g., 21,20,19)'
        type: string
        default: '21,20,19'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ckm-glgc-autosome-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-chr22-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      chromosomes: ${{ steps.plan.outputs.chromosomes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get aggregate from completed chr22 run in this repository
        uses: actions/download-artifact@v4
        with:
          name: ckm-glgc-chr-aggregate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.chr22_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/chr22_gate
      - name: Validate prior real chr22 PASS and limit batch size
        id: plan
        env:
          CHROMOSOMES: ${{ inputs.chromosomes }}
        run: |
          python -m unittest tests.test_ckm_stroke_glgc_batch_plan -v
          python -m scripts.ckm_stroke.plan_glgc_batch \
            --chromosomes "$CHROMOSOMES" \
            --chr22-gate artifacts/chr22_gate/glgc_chr22-aggregate.json \
            --output artifacts/ckm_stroke/batch_plan.json
      - name: Save bounded work plan
        uses: actions/upload-artifact@v4
        with:
          name: ckm-glgc-batch-plan
          path: artifacts/ckm_stroke/batch_plan.json
          retention-days: 30

  chromosome-trait-snp-qc:
    needs: verify-chr22-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.verify-chr22-and-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned htslib bindings and CA bundle
        run: |
          python -m pip install pysam==0.23.3 certifi
      - name: Configure SSL verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import certifi
          import os
          ca = Path(certifi.where())
          if not ca.is_file() or ca.stat().st_size < 1000:
              raise RuntimeError("certifi trust store missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key in ("CURL_CA_BUNDLE", "SSL_CERT_FILE", "REQUESTS_CA_BUNDLE"):
                  f.write(key + "=" + str(ca) + "\n")
          PY
      - name: Run full selected chromosome SNP audit (not a whole GWAS)
        env:
          TRAIT: ${{ matrix.trait }}
          CHROMOSOME: ${{ matrix.chromosome }}
        run: |
          python -m scripts.ckm_stroke.glgc_chr_shard \
            --trait "$TRAIT" --chromosome "$CHROMOSOME" --max-rows 5000000 \
            --out "artifacts/ckm_stroke/glgc_$TRAIT-chr$CHROMOSOME-snp-qc.json"
      - name: Save audit metadata even when HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-glgc-batch-${{ matrix.chromosome }}-${{ matrix.trait }}
          path: artifacts/ckm_stroke/glgc_*.json
          retention-days: 30
          if-no-files-found: warn

  aggregate-by-chromosome:
    if: ${{ always() && needs.verify-chr22-and-plan.result == 'success' }}
    needs: [verify-chr22-and-plan, chromosome-trait-snp-qc]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        chromosome: ${{ fromJSON(needs.verify-chr22-and-plan.outputs.chromosomes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download this chromosome's three trait artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ckm-glgc-batch-${{ matrix.chromosome }}-*
          path: artifacts/per_chromosome
          merge-multiple: true
      - name: Aggregate all three source-matched traits (HOLD if missing)
        env:
          CHROMOSOME: ${{ matrix.chromosome }}
        run: |
          python -m scripts.ckm_stroke.summarize_glgc_chr \
            --input-dir artifacts/per_chromosome \
            --chromosome "$CHROMOSOME" \
            --output "artifacts/ckm_stroke/glgc_chr$CHROMOSOME-aggregate.json"
      - name: Upload independent per-chromosome summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-glgc-batch-summary-${{ matrix.chromosome }}
          path: artifacts/ckm_stroke/glgc_chr*-aggregate.json
          retention-days: 30
          if-no-files-found: warn
