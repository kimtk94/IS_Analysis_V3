name: HCC Stage30 Bounded Protein Quant Header

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hcc-stage30-gao-quant-header.yml'
      - 'scripts/hcc/probe_stage30_gao_quant_header.py'
      - 'tests/test_hcc_stage30_bounded_header.py'

permissions:
  contents: read

jobs:
  protein-assembly-header-existence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate read-only range access and no genomic, phenotype or sample ID export
        run: python -m unittest discover -s tests -p 'test_hcc_stage30_bounded_header.py' -v
      - name: Inspect at most 8KB each of two PDC Protein Assembly files per study
        run: |
          python scripts/hcc/probe_stage30_gao_quant_header.py \
            --out results/hcc/stage30/assembly_bounded_header.json \
            --review-out results/hcc/stage30/assembly_bounded_header_review.json
      - name: Upload aggregate table geometry only; no row/column headers or URLs
        uses: actions/upload-artifact@v4
        with:
          name: hcc-stage30-pdc-198-199-bounded-assembly-header-shapes
          path: |
            results/hcc/stage30/assembly_bounded_header.json
            results/hcc/stage30/assembly_bounded_header_review.json
          retention-days: 30
          if-no-files-found: error
