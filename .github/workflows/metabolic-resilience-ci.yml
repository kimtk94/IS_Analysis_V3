name: Metabolic Resilience CI

on:
  push:
    branches:
      - main
      - 'research/metabolic-resilience-*'
    paths:
      - 'scripts/metabolic_resilience/**'
      - 'scripts/ci/check_metabolic_resilience_scripts.py'
      - '.github/workflows/metabolic-resilience-ci.yml'
  pull_request:
    paths:
      - 'scripts/metabolic_resilience/**'
      - 'scripts/ci/check_metabolic_resilience_scripts.py'
      - '.github/workflows/metabolic-resilience-ci.yml'
  workflow_dispatch:

jobs:
  static-review:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Repository smoke test
        run: bash scripts/codex_smoke_test.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash, embedded Python, and project-policy checks
        run: python3 scripts/ci/check_metabolic_resilience_scripts.py

      - name: ShellCheck metabolic-resilience scripts
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/metabolic_resilience/*.sh)
          if ((${#files[@]} == 0)); then
            echo "No metabolic-resilience scripts committed yet."
            exit 0
          fi
          shellcheck -x -S warning "${files[@]}"
