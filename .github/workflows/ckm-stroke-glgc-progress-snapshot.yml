name: CKM Stroke GLGC chr22+21+20 verified coverage snapshot

on:
  push:
    paths:
      - '.github/workflows/ckm-stroke-glgc-progress-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ckm-glgc-coverage-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline coverage and source provenance contract tests
        run: |
          python -m py_compile scripts/ckm_stroke/audit_glgc_autosomes.py
          python -m unittest tests.test_ckm_stroke_audit_glgc_autosomes -v
      - name: Fetch verified original chr22 aggregate from technical-PASS run
        uses: actions/download-artifact@v4
        with:
          name: ckm-glgc-chr-aggregate
          repository: ${{ github.repository }}
          run-id: '43431051168'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/verified_aggregates
      - name: Fetch only three completed chr21 QC source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ckm-glgc-batch-21-*
          repository: ${{ github.repository }}
          run-id: '43848671279'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/chr21_source
          merge-multiple: true
      - name: Build chr21 independent 3-trait aggregate from real source artifacts
        run: |
          python -m scripts.ckm_stroke.summarize_glgc_chr \
            --input-dir artifacts/chr21_source \
            --chromosome 21 \
            --output artifacts/verified_aggregates/glgc_chr21-aggregate.json
      - name: Verify chr21 aggregate preserves original real-data source commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/verified_aggregates/glgc_chr21-aggregate.json")
          report=json.loads(p.read_text())
          source_commits={v["source_commit"] for v in report["traits"].values()}
          assert report["status"]=="PASS", "chr21 3/3 aggregate not PASS"
          assert len(source_commits)==1, "chr21 sources came from different commits"
          assert report["source_commit"]==next(iter(source_commits)), "source provenance overwritten by later aggregator commit"
          assert report["summary_generated_from_commit"]!=report["source_commit"], "expected independently generated summary"
          print("chr21 source commit preserved:", report["source_commit"])
          print("summary generated from:", report["summary_generated_from_commit"])
          PY
      - name: Fetch three completed chr20 real-data source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ckm-glgc-batch-20-*
          repository: ${{ github.repository }}
          run-id: '43848671279'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/chr20_source
          merge-multiple: true
      - name: Build chr20 independent aggregate and preserve evidence commit
        run: |
          python -m scripts.ckm_stroke.summarize_glgc_chr \
            --input-dir artifacts/chr20_source \
            --chromosome 20 \
            --output artifacts/verified_aggregates/glgc_chr20-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/verified_aggregates/glgc_chr20-aggregate.json").read_text())
          commits={v["source_commit"] for v in d["traits"].values()}
          assert d["status"]=="PASS" and len(d["traits"])==3 and len(commits)==1
          assert d["source_commit"]==next(iter(commits)), "original chr20 source commit lost"
          print("chr20 real source commit:", d["source_commit"])
          PY
      - name: Validate 22-autosome coverage honestly (PARTIAL until all 22)
        run: |
          python -m scripts.ckm_stroke.audit_glgc_autosomes \
            --input-dir artifacts/verified_aggregates \
            --output artifacts/glgc_autosome_coverage_snapshot.json
      - name: Assert verified coverage and prevent whole-GWAS false PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/glgc_autosome_coverage_snapshot.json").read_text())
          assert d["status"]=="PARTIAL" and d["scientific_status"]=="HOLD", d["status"]
          assert d["observed_chromosome_pass"]==3 and d["trait_chromosome_pass"]==9
          assert d["missing_chromosome_count"]==19
          assert d["totals_verified_pass_only"]["retained_snp_rows"]==6457067
          assert not d["whole_source_checksum_verified"]
          print("Verified 3/22 chromosomes, 9/66 trait-chromosome technical PASS, 6,457,067 SNP records")
          PY
      - name: Publish evidence-only results, not raw GWAS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-glgc-chr22-21-20-coverage-snapshot
          path: |
            artifacts/verified_aggregates/glgc_chr*-aggregate.json
            artifacts/glgc_autosome_coverage_snapshot.json
          retention-days: 30
          if-no-files-found: warn
