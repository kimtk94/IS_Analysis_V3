name: IS P3A ROSMAP independent historical QC report sample-lineage audit

on:
  push:
    paths:
      - '.github/workflows/is-p3a-rosmap-official-qc-report-lineage.yml'
      - 'scripts/is/audit_p3a_rosmap_official_qc_report_stages.py'
      - 'tests/test_is_p3a_rosmap_official_qc_report_stages.py'
      - 'docs/is/IS_P3A_ROSMAP_OFFICIAL_QC_REPORT_LINEAGE_20261123.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: is-p3a-rosmap-official-QC-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-publisher-QC-report-and-Release7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical fixture checkout for existing whole-repo regression suite
        uses: actions/checkout@v4
        with:
          ref: 0bf646fd6f29322d17da878253f37def24c01c74
          path: legacy
          persist-credentials: false
      - name: Install current smoke suite dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'openpyxl>=3.1,<4'
      - name: Compile and test independent source and privacy guards
        run: |
          python -m py_compile scripts/is/audit_p3a_rosmap_official_qc_report_stages.py
          python -m unittest discover -s tests -p 'test_is_p3a_rosmap_official_qc_report_stages.py' -v
      - name: Whole repository regression tests
        run: bash scripts/codex_smoke_test.sh
      - name: Independently fetch official ROSMAP QC report and compare non-equivalent study stages
        run: |
          python -m scripts.is.audit_p3a_rosmap_official_qc_report_stages \
            --manifest docs/is/evidence/IS_P3A_RESTORED_REAL_36_ASSAY_KEYS_20261122.json \
            --out artifacts/is/IS_P3A_ROSMAP_QC_report_and_Release7_36_group_HOLD.json
      - name: Upload only official source hashes, aggregate counts, scientific HOLD decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is-p3a-36-rosmap-official-QC-report-lineage-HOLD
          path: artifacts/is/IS_P3A_ROSMAP_QC_report_and_Release7_36_group_HOLD.json
          if-no-files-found: warn
          retention-days: 30
